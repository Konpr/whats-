            (Array.isArray(blocks) ? blocks : []).forEach((block) => {

            const s = String(text ?? '');
            if (!s) return false;

            let depthParen = 0;
            let depthBrace = 0;
            let depthBrack = 0;
            const isWordChar = (ch) => /[A-Za-z0-9_]/.test(ch || '');

            for (let i = 0; i < s.length; i += 1) {
                const ch = s[i];
                if (ch === '\\') {
                    i += 1;
                    continue;
                }

                if (depthParen === 0 && depthBrace === 0 && depthBrack === 0) {
                    const prev = i > 0 ? s[i - 1] : '';
                    const next = i + 1 < s.length ? s[i + 1] : '';

                    if (ch === '&' && (!prev || /\s/.test(prev)) && (!next || /\s/.test(next))) {
                        return true;
                    }

                    if (s.startsWith('AND', i)) {
                        const prevBlocks = prev === '\\' || isWordChar(prev);
                        const nextCh = i + 3 < s.length ? s[i + 3] : '';
                        const nextBlocks = isWordChar(nextCh);
                        if (!prevBlocks && !nextBlocks) {

                    }

                else if (ch === ')' && depthParen > 0) depthParen -= 1;
                else if (ch === '{') depthBrace += 1;
                else if (ch === '}' && depthBrace > 0) depthBrace -= 1;
                else if (ch === '[') depthBrack += 1;
                else if (ch === ']' && depthBrack > 0) depthBrack -= 1;

                case 'ease-in':
                    return x * x;
                case 'ease-out':
                    return x * (2 - x);
                case 'ease-in-out':
                    return x * x * (3 - 2 * x);

                    return x;

            const body = String(content?.body || '').trim();
            const start = Number(content?.start);
            const end = Number(content?.end);
            const easing = String(content?.easing || 'linear');
            if (!body || !Number.isFinite(start) || !Number.isFinite(end)) return '';
            const ratio = steps <= 1 ? 1 : (safeStep - 1) / (steps - 1);

            const weight = start + ((end - start) * eased);

            return normalized;
        };

        const buildBlendPreview = (content) => {
            const prefix = String(content?.prefix || '').trim();
            const suffix = String(content?.suffix || '').trim();
            const mode = String(content?.mode || 'mean').toLowerCase();
            const channelTarget = String(content?.channelTarget || 'both').toLowerCase();
            const intensityRaw = String(content?.intensity ?? '').trim();
            const intensity = intensityRaw === '' ? 1 : Number(intensityRaw);
            const branches = Array.isArray(content?.branches) ? content.branches : [];
            const active = branches
                .filter((branch) => String(branch?.text || '').trim() !== '')
                .map((branch) => ({
                    text: joinPhrase(prefix, branch?.text || '', suffix),
                    weight: Number(branch?.weight ?? 1)
                }))
                .filter((branch) => branch.text);
            if (!active.length) return '';
            const effectiveWeights = shapeBlendWeights(active.map((branch) => branch.weight), mode, intensity);
            const parts = active
                .map((branch, index) => ({ text: branch.text, weight: effectiveWeights[index] }))
                .map((branch) => ({ ...branch, text: normalizePreviewText(branch.text) }))
                .filter((branch) => branch.text && Math.abs(Number(branch.weight) || 0) > 1e-8)
                .map((branch) => `${branch.text}*${compactNumber(branch.weight, 4)}`);
            if (!parts.length) return '';
            const previewPrefix = channelTarget !== 'both' ? `BLEND@${channelTarget}<` : 'BLEND<';
            return `${previewPrefix}${parts.join(' + ')}>`;
        };

        const resolveMorphWindowSteps = (content, totalSteps) => {
            const steps = Math.max(1, Math.min(TIMELINE_MAX_STEPS, Number(totalSteps) || 20));
            const mode = String(content?.mode || 'points').toLowerCase();
            if (mode !== 'window') return null;
            const start = parseBoundarySpec(content?.windowStart, steps);
            const end = parseBoundarySpec(content?.windowEnd, steps);
            if (start === null || end === null || end <= start) return null;
            return { start, end };
        };

        const resolveMorphPositions = (content, totalSteps) => {
            const steps = Math.max(1, Math.min(TIMELINE_MAX_STEPS, Number(totalSteps) || 20));
            const src = Array.isArray(content?.points) ? content.points.filter((point) => String(point?.text || '').trim() !== '') : [];
            if (!src.length) return [];
            const windowSteps = resolveMorphWindowSteps(content, steps);
            if (windowSteps) {
                const { start, end } = windowSteps;
                const span = end - start;
                const count = src.length;
                if (span < count - 1) return [];
                const positions = [start];
                for (let i = 1; i < count - 1; i++) {
                    const remainingSlots = (count - 1) - i;
                    const raw = start + (span * i) / (count - 1);
                    let pos = start + Math.floor((raw - start) + 0.5);
                    pos = Math.max(positions[positions.length - 1] + 1, pos);
                    pos = Math.min(pos, end - remainingSlots);
                    if (pos <= positions[positions.length - 1]) return [];
                    positions.push(pos);
                }
                positions.push(end);
                return positions;
            }

            const out = [];
            for (let i = 0; i < src.length; i++) {
                if (i === 0) {
                    out.push(1);
                    continue;
                }
                const raw = String(src[i]?.boundary || '').trim();
                out.push(raw ? (parseBoundarySpec(raw, steps) ?? steps) : steps);
            }
            for (let i = 1; i < out.length; i++) {
                out[i] = Math.max(out[i], out[i - 1]);
            }
            if (!String(src[src.length - 1]?.boundary || '').trim()) {
                out[out.length - 1] = Math.max(out[out.length - 1], steps);
            }
            return out;
        };

        const shapeMorphProgress = (t, intensity) => {
            const x = Math.max(0, Math.min(1, Number(t) || 0));
            const k = Number(intensity ?? 1);
            if (!Number.isFinite(k) || k <= 0) return x;
            if (x <= 0 || x >= 1 || Math.abs(k - 1) <= 1e-8) return x;
            const left = Math.pow(x, k);
            const right = Math.pow(1 - x, k);
            const denom = left + right;
            if (!Number.isFinite(denom) || denom <= 0) return x;
            return left / denom;
        };

        const computeMorphScaledT = (positions, step) => {
            const count = Array.isArray(positions) ? positions.length : 0;
            if (count <= 1) return 1;
            const safeStep = Number(step) || 1;
            if (safeStep <= positions[0]) return 0;
            for (let idx = 0; idx < count - 1; idx += 1) {
                const left = Number(positions[idx]) || 1;
                const right = Number(positions[idx + 1]) || left;
                if (safeStep <= right) {
                    const local = right === left ? 0 : (safeStep - left) / Math.max(1, right - left);
                    return (idx + local) / (count - 1);
                }
            }
            return 1;
        };

        const computeMorphCurveWeights = (count, positions, step, curve, intensity) => {
            if (count <= 0) return [];
            if (count === 1) return [1];

            const scaledT = shapeMorphProgress(computeMorphScaledT(positions, step), intensity);
            const safeCurve = String(curve || 'linear').toLowerCase();

            if (safeCurve === 'linear') {
                if (scaledT <= 0) return [1, ...Array(count - 1).fill(0)];
                if (scaledT >= 1) return [...Array(count - 1).fill(0), 1];
                const segmentPos = scaledT * (count - 1);
                const left = Math.min(Math.floor(segmentPos), count - 2);
                const alpha = segmentPos - left;
                const weights = Array(count).fill(0);
                weights[left] = 1 - alpha;
                weights[left + 1] = alpha;
                return weights;
            }

            if (safeCurve === 'bezier') {
                const degree = count - 1;
                return Array.from({ length: count }, (_, idx) => {
                    const comb = (() => {
                        let acc = 1;
                        for (let i = 1; i <= idx; i += 1) acc = (acc * (degree - idx + i)) / i;
                        return acc;
                    })();
                    return comb * Math.pow(1 - scaledT, degree - idx) * Math.pow(scaledT, idx);
                });
            }

            if (safeCurve === 'catmull') {
                if (scaledT <= 0) return [1, ...Array(count - 1).fill(0)];
                if (scaledT >= 1) return [...Array(count - 1).fill(0), 1];
                const segmentPos = scaledT * (count - 1);
                const i = Math.min(Math.floor(segmentPos), count - 2);
                const u = segmentPos - i;
                const idx0 = Math.max(i - 1, 0);
                const idx1 = i;
                const idx2 = i + 1;
                const idx3 = Math.min(i + 2, count - 1);
                const w0 = -0.5 * u * u * u + u * u - 0.5 * u;
                const w1 = 1.5 * u * u * u - 2.5 * u * u + 1;
                const w2 = -1.5 * u * u * u + 2 * u * u + 0.5 * u;
                const w3 = 0.5 * u * u * u - 0.5 * u * u;
                const weights = Array(count).fill(0);
                weights[idx0] += w0;
                weights[idx1] += w1;
                weights[idx2] += w2;
                weights[idx3] += w3;
                return weights;
            }

            return computeMorphCurveWeights(count, positions, step, 'linear', intensity);
        };

        const resolveMorphPointWeights = (points, weights) => {
            const base = (Array.isArray(weights) ? weights : []).map((weight) => Number(weight) || 0);
            const pointWeights = (Array.isArray(points) ? points : []).map((point) => {
                const raw = String(point?.weight ?? '').trim();
                if (raw === '') return 1;
                const parsed = Number(raw);
                return Number.isFinite(parsed) && parsed > 0 ? parsed : 1;
            });
            if (pointWeights.every((weight) => Math.abs(weight - 1) <= 1e-8)) return base;
            const effective = base.map((weight, idx) => weight * (pointWeights[idx] ?? 1));
            const total = effective.reduce((acc, weight) => acc + weight, 0);
            if (Number.isFinite(total) && Math.abs(total) > 1e-8) {
                return effective.map((weight) => weight / total);
            }
            return effective;
        };

        const buildMorphPreviewText = (texts, weights, channelTarget) => {
            const nonZero = (Array.isArray(texts) ? texts : [])
                .map((text, idx) => ({ text: normalizePreviewText(text), weight: Number((weights || [])[idx]) || 0 }))
                .filter((entry) => entry.text && Math.abs(entry.weight) > 1e-8);
            if (!nonZero.length) return '';
            if (nonZero.length === 1 && Math.abs(nonZero[0].weight - 1) <= 1e-8) return nonZero[0].text;
            const target = String(channelTarget || 'both').toLowerCase();
            const prefix = target === 'both' ? 'MORPH<' : `MORPH@${target}<`;
            return `${prefix}${nonZero.map((entry) => `${entry.text}*${compactNumber(entry.weight, 4)}`).join(' + ')}>`;
        };

        const buildMorphPreview = (content, step, totalSteps) => {
            const steps = Math.max(1, Math.min(TIMELINE_MAX_STEPS, Number(totalSteps) || 20));
            const safeStep = clampStep(step, steps);
            const prefix = String(content?.prefix || '').trim();
            const suffix = String(content?.suffix || '').trim();
            const curve = String(content?.curve || 'linear');
            const channelTarget = String(content?.channelTarget || 'both').toLowerCase();
            const intensityRaw = String(content?.intensity ?? '').trim();
            const intensity = intensityRaw === '' ? 1 : Number(intensityRaw);
            const points = Array.isArray(content?.points) ? content.points : [];
            const validPoints = points.filter((point) => String(point?.text || '').trim() !== '');
            if (validPoints.length < 2) return joinPhrase(prefix, suffix);

            const positions = resolveMorphPositions({ ...content, points: validPoints }, steps);
            if (!positions.length) return joinPhrase(prefix, suffix);
            const windowSteps = resolveMorphWindowSteps(content, steps);
            if (windowSteps && (safeStep < windowSteps.start || safeStep > windowSteps.end)) {
                return joinPhrase(prefix, suffix);
            }
            const activeTexts = validPoints.map((point) => joinPhrase(prefix, point?.text || '', suffix));
            const weights = resolveMorphPointWeights(
                validPoints,
                computeMorphCurveWeights(validPoints.length, positions, safeStep, curve, intensity)
            );
            const preview = buildMorphPreviewText(activeTexts, weights, channelTarget);
            return preview || joinPhrase(prefix, suffix);
        };

        const parseRangeTokenForTimeline = (token, steps) => {
            const m = String(token || '').trim().match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+)%?)\s*-\s*([+-]?(?:\d+(?:\.\d+)?|\.\d+)%?)$/);
            if (!m) return null;
            const left = m[1];
            const right = m[2];
            const leftPct = left.endsWith('%');
            const rightPct = right.endsWith('%');
            if (leftPct !== rightPct) return null;

            const leftNum = Number(left.replace('%', ''));
            const rightNum = Number(right.replace('%', ''));
            if (!Number.isFinite(leftNum) || !Number.isFinite(rightNum)) return null;

            const toStep = (value, pct) => {
                const raw = pct ? (value / 100) * steps : value;
                return clampStep(Math.round(raw), steps);
            };

            const start = toStep(leftNum, leftPct);
            const end = toStep(rightNum, rightPct);
            if (start > end) return null;
            return { start, end };
        };

        const dedupScheduleRows = (rows, steps) => {
            const out = [];
            (rows || []).forEach((row) => {
                const end = clampStep(Array.isArray(row) ? row[0] : steps, steps);
                const text = String(Array.isArray(row) ? (row[1] ?? '') : '');
                const prevEnd = out.length ? out[out.length - 1][0] : 0;
                const safeEnd = Math.max(prevEnd || 1, end);
                if (out.length && out[out.length - 1][0] === safeEnd && out[out.length - 1][1] === text) return;
                out.push([safeEnd, text]);
            });
            if (!out.length) out.push([Math.max(1, Number(steps) || 1), '']);
            return out;
        };

        const buildScheduleTimeline = (content, totalSteps) => {
            const steps = Math.max(1, Math.min(TIMELINE_MAX_STEPS, Number(totalSteps) || 20));
            const rawPrompts = Array.isArray(content?.prompts) && content.prompts.length
                ? content.prompts.map((x) => String(x ?? ''))
                : [''];

            if (!rawPrompts.length || rawPrompts.every((x) => x.trim() === '')) {
                return [[steps, '']];
            }

            const prompts = content?.reverse ? [...rawPrompts].reverse() : [...rawPrompts];
            const boundary = toBoundaryStep(content?.limit, steps);
            const rangesText = String(content?.ranges || '').trim();
            const rangeTokens = rangesText ? rangesText.split(',').map((x) => x.trim()).filter(Boolean) : [];

            if (rangeTokens.length && boundary !== null) {
                const ranges = [];
                rangeTokens.forEach((token) => {
                    const parsed = parseRangeTokenForTimeline(token, steps);
                    if (parsed) ranges.push(parsed);
                });

                if (!ranges.length) {
                    return [[steps, '']];
                }

                const slot = new Array(steps + 1).fill('');
                ranges.forEach((range, idx) => {
                    const center = prompts.length ? String(prompts[idx % prompts.length] ?? '') : '';
                    for (let s = range.start; s <= range.end; s++) {
                        slot[s] = center;
                    }
                });

                const rows = [];
                let cur = slot[1] || '';
                for (let s = 2; s <= steps; s++) {
                    if (slot[s] !== cur) {
                        rows.push([s - 1, cur]);
                        cur = slot[s];
                    }
                }
                rows.push([steps, cur]);
                return dedupScheduleRows(rows, steps);
            }

            if (boundary === null) {
                return [[steps, String(prompts[0] ?? '')]];
            }

            if (prompts.length === 1) {
                const rows = boundary >= steps
                    ? [[steps, String(prompts[0] ?? '')]]
                    : [[boundary, ''], [steps, String(prompts[0] ?? '')]];
                return dedupScheduleRows(rows, steps);
            }

            const intervals = [];
            const promptCount = prompts.length;
            const stepSize = boundary / promptCount;

            for (let i = 0; i < promptCount; i++) {
                const start = clampStep(Math.round(i * stepSize) + 1, steps);
                const end = clampStep(Math.round((i + 1) * stepSize), steps);
                if (start <= end) intervals.push({ start, end });
            }

            const rows = [];
            for (let i = 0; i < Math.min(intervals.length, promptCount); i++) {
                rows.push([intervals[i].end, String(prompts[i] ?? '')]);
            }
            if (intervals.length && intervals[intervals.length - 1].end < steps) {
                rows.push([steps, String(prompts[prompts.length - 1] ?? '')]);
            }
            if (!intervals.length) {
                rows.push([steps, String(prompts[prompts.length - 1] ?? '')]);
            }

            return dedupScheduleRows(rows, steps);
        };

        const textAtStepFromSchedule = (schedule, step, totalSteps) => {
            const steps = Math.max(1, Math.min(TIMELINE_MAX_STEPS, Number(totalSteps) || 20));
            const safeStep = clampStep(step, steps);
            const rows = Array.isArray(schedule) && schedule.length ? schedule : [[steps, '']];
            for (let i = 0; i < rows.length; i++) {
                const end = clampStep(rows[i][0], steps);
                if (safeStep <= end) return String(rows[i][1] ?? '');
            }
            return String(rows[rows.length - 1][1] ?? '');
        };

        const normalizeAlternate2Options = (options) => {
            const src = Array.isArray(options) ? options.map((x) => String(x ?? '').trim()) : [];
            const firstNonEmpty = src.find((x) => x !== '') || '';
            const suffix = firstNonEmpty.includes('_') ? firstNonEmpty.split('_', 2)[1] : '';
            if (!suffix) return src;
            return src.map((token) => {
                if (!token) return '';
                if (token.includes('_')) return token;
                return `${token}_${suffix}`;
            });
        };

        const serializeBlock = (block) => {
            const c = block?.content || {};
            switch (block?.type) {
                case 'text': {
                    if (!String(c.text || '').trim()) return '';
                    const weight = Number(c.weight ?? 1);
                    if (c.wrapper === '[') return `[${c.text}]`;
                    if (c.wrapper === '(') {
                        return weight === 1.0 ? `(${c.text})` : `(${c.text}:${compactNumber(weight, 2)})`;
                    }
                    return weight === 1.0 ? c.text : `${c.text}:${compactNumber(weight, 2)}`;
                }
                case 'hybrid': {
                    const validItems = (c.items || []).filter((i) => String(i.text || '').trim() !== '');
                    if (!validItems.length) return '';
                    return validItems.map((i) => `(${i.text}:${compactNumber(Number(i.weight || 1), 2)})`).join(' AND ');
                }
                case 'schedule': {
                    const validPrompts = (Array.isArray(c.prompts) && c.prompts.length) ? c.prompts : [''];
                    if (validPrompts.every((x) => String(x || '').trim() === '')) return '';
                    const mode = c.mode || 'postfix';
                    const limit = String(c.limit || '').trim();
                    const ranges = String(c.ranges || '').trim();
                    if (mode === 'inner') {
                        let inside = validPrompts.join(':');
                        if (limit) inside += `:${limit}`;
                        if (ranges) inside += ` ${ranges}`;
                        let out = `[${inside}]`;
                        if (c.reverse) out += ' reverse';
                        return out;
                    }
                    const core = `[${validPrompts.join(':')}]`;
                    let suffix = '';
                    if (limit) suffix += `:${limit}`;
                    if (ranges) suffix += ` ${ranges}`;
                    if (c.reverse) suffix += ' reverse';
                    return core + suffix;
                }
                case 'alternate': {
                    const options = Array.isArray(c.options) ? c.options : [];
                    if (!options.length) return '';
                    const core = `[${options.join('|')}]`;
                    const distinctMark = c.distinct ? '!' : '';
                    const countPrefix = Number(c.count) > 1 ? Number(c.count) : '';
                    return `${countPrefix}${core}${distinctMark}`;
                }
                case 'alternate1': {
                    const options = Array.isArray(c.options) ? c.options : [];
                    if (!options.length) return '';
                    return options.join('|');
                }
                case 'alternate2': {
                    const options = Array.isArray(c.options) ? c.options : [];
                    if (!options.length) return '';
                    return options.join('|');
                }
                case 'interp': {
                    const body = String(c.body || '').trim();
                    const start = Number(c.start);
                    const end = Number(c.end);
                    if (!body || !Number.isFinite(start) || !Number.isFinite(end)) return '';
                    const easing = String(c.easing || 'linear');
                    const suffix = easing && easing !== 'linear' ? `~${easing}` : '';
                    return `(${body}:${compactNumber(start)}->${compactNumber(end)}${suffix})`;
                }
                case 'pool': {
                    const body = String(c.body || '').trim();
                    if (!body) return '';
                    return `POOL{${body}}`;
                }
                case 'bind': {
                    const owner = String(c.owner || '').trim();
                    const attrs = String(c.attrs || '').trim();
                    if (!owner || !attrs) return '';
                    const rawWeight = String(c.weight ?? '').trim();
                    const weight = Number(rawWeight === '' ? 1 : rawWeight);
                    const prefix = Number.isFinite(weight) && Math.abs(weight - 1) > 1e-8 ? `^${compactNumber(weight)}` : '';
                    return `BIND${prefix}{${owner} => ${attrs}}`;
                }
                case 'assemble': {
                    const enc1 = String(c.enc1 || '').trim();
                    const enc2 = String(c.enc2 || '').trim();
                    const pooled = String(c.pooled || '').trim();
                    if (!enc1 || !enc2) return '';
                    const fields = [`enc1=${enc1}`, `enc2=${enc2}`];
                    if (pooled) fields.push(`pooled=${pooled}`);
                    const core = `ASSEMBLE{${fields.join('; ')}}`;
                    return joinPhrase(c.prefix || '', core, c.suffix || '');
                }
                case 'chunk': {
                    const branches = Array.isArray(c.branches) ? c.branches : [];
                    const branchText = branches
                        .filter((branch) => String(branch?.text || '').trim() !== '')
                        .map((branch) => {
                            const text = String(branch.text || '').trim();
                            const weight = Number(branch.weight ?? 1);
                            return Number.isFinite(weight) && weight !== 1
                                ? `${text}*${compactNumber(weight, 3)}`
                                : text;
                        })
                        .join(' | ');
                    if (!branchText) return '';
                    const sharedChannel = String(c.sharedChannel || 'none').toLowerCase();
                    const modePrefix = sharedChannel === 'pooled'
                        ? '[share-pooled]'
                        : sharedChannel === 'cross'
                            ? '[share-cross]'
                            : '';
                    const core = `CHUNK${modePrefix}{${branchText}}`;
                    return joinPhrase(c.prefix || '', core, c.suffix || '');
                }
                case 'blend': {
                    const branches = Array.isArray(c.branches) ? c.branches : [];
                    const branchText = branches
                        .filter((branch) => String(branch?.text || '').trim() !== '')
                        .map((branch) => {
                            const text = String(branch.text || '').trim();
                            const weight = Number(branch.weight ?? 1);
                            return Number.isFinite(weight) && weight !== 1
                                ? `${text}*${compactNumber(weight, 3)}`
                                : text;
                        })
                        .join(' | ');
                    if (!branchText) return '';
                    const mode = String(c.mode || 'mean').toLowerCase();
                    const channelTarget = String(c.channelTarget || 'both').toLowerCase();
                    const intensityRaw = String(c.intensity ?? '').trim();
                    const intensity = intensityRaw === '' ? 1 : Number(intensityRaw);
                    const modeCore = mode === 'sum' ? 'sum' : 'mean';
                    const channelSuffix = channelTarget !== 'both' ? `@${channelTarget}` : '';
                    const modePrefix = modeCore === 'mean' && !channelSuffix ? '' : `[${modeCore}${channelSuffix}]`;
                    const intensityPrefix = Number.isFinite(intensity) && Math.abs(intensity - 1) > 1e-8
                        ? `^${compactNumber(intensity, 3)}`
                        : '';
                    const core = `BLEND${intensityPrefix}${modePrefix}{${branchText}}`;
                    return joinPhrase(c.prefix || '', core, c.suffix || '');
                }
                case 'morph': {
                    const points = Array.isArray(c.points) ? c.points : [];
                    const mode = String(c.mode || 'points').toLowerCase();
                    const channelTarget = String(c.channelTarget || 'both').toLowerCase();
                    const intensityRaw = String(c.intensity ?? '').trim();
                    const intensity = intensityRaw === '' ? 1 : Number(intensityRaw);
                    const serializedPoints = points
                        .filter((point) => String(point?.text || '').trim() !== '')
                        .map((point, index) => {
                            const text = String(point.text || '').trim();
                            const weightRaw = String(point.weight ?? '').trim();
                            const weight = weightRaw === '' ? 1 : Number(weightRaw);
                            const weightSuffix = Number.isFinite(weight) && Math.abs(weight - 1) > 1e-8
                                ? `*${compactNumber(weight, 3)}`
                                : '';
                            const coreText = `${text}${weightSuffix}`;
                            const boundary = String(point.boundary || '').trim();
                            if (mode === 'window') return coreText;
                            return index === 0 || !boundary ? coreText : `${coreText}@${boundary}`;
                        })
                        .join(' => ');
                    if (!serializedPoints) return '';
                    const curve = String(c.curve || 'linear');
                    const curveSuffix = curve && curve !== 'linear' ? ` ~ ${curve}` : '';
                    const windowStart = String(c.windowStart || '').trim();
                    const windowEnd = String(c.windowEnd || '').trim();
                    const windowPrefix = mode === 'window' && windowStart && windowEnd ? `[${windowStart}-${windowEnd}]` : '';
                    const intensityPrefix = Number.isFinite(intensity) && Math.abs(intensity - 1) > 1e-8
                        ? `^${compactNumber(intensity, 3)}`
                        : '';
                    const channelPrefix = channelTarget !== 'both' ? `@${channelTarget}` : '';
                    const core = `MORPH${intensityPrefix}${channelPrefix}${windowPrefix}{${serializedPoints}${curveSuffix}}`;
                    return joinPhrase(c.prefix || '', core, c.suffix || '');
                }
                case 'sequence': {
                    const owner = String(c.owner || '').trim();
                    if (!owner) return '';
                    if (c.type === 'deep') {
                        const inner = (c.inner || []).filter((x) => x).join('::');
                        const outer = (c.outer || []).filter((x) => x).join(',');
                        return `${owner} ::: ${inner} !!! ${outer}`;
                    }
                    const inner = (c.inner || []).filter((x) => x).join('::');
                    if (c.type === 'top') {
                        const outer = (c.outer || []).filter((x) => x).join(', ');
                        const tail = outer ? `, ${outer}` : '';
                        return `${owner}::${inner}!!${tail}`;
                    }
                    const term = c.random ? '~' : '';
                    return `${owner}::${inner}${term}`;
                }
                case 'group': {
                    const items = (c.items || []).filter((x) => x).join(', ');
                    return items ? `{${items}}` : '';
                }
                case 'and':
                    return ' AND ';
                case 'break':
                    return ' BREAK ';
                default:
                    return '';
            }
        };

        const resolveBlockAtStep = (block, step, totalSteps) => {
            const c = block?.content || {};
            const steps = Math.max(1, Math.min(TIMELINE_MAX_STEPS, Number(totalSteps) || 20));
            const safeStep = clampStep(step, steps);

            if (block?.type === 'schedule') {
                const schedule = buildScheduleTimeline(c, steps);
                return textAtStepFromSchedule(schedule, safeStep, steps);
            }

            if (block?.type === 'alternate') {
                const options = Array.isArray(c.options) ? c.options.map((x) => String(x ?? '')) : [];
                if (!options.length) return '';
                const count = Math.max(1, Number(c.count) || 1);
                if (count === 1 && !c.distinct) {
                    return options[(safeStep - 1) % options.length] || '';
                }
                if (count === 1 && c.distinct) {
                    return options[0] || '';
                }
                return serializeBlock(block);
            }

            if (block?.type === 'alternate1') {
                const options = Array.isArray(c.options) ? c.options.map((x) => String(x ?? '')) : [];
                if (!options.length) return '';
                return options[(safeStep - 1) % options.length] || '';
            }

            if (block?.type === 'alternate2') {
                const normalized = normalizeAlternate2Options(c.options || []).filter((x) => x !== '');
                return normalized.join('|');
            }

            if (block?.type === 'interp') {
                return buildInterpolationPreview(c, safeStep, steps);
            }

            if (block?.type === 'pool') {
                return buildPoolPreview(c);
            }

            if (block?.type === 'bind') {
                return buildBindPreview(c);
            }

            if (block?.type === 'assemble') {
                return buildAssemblePreview(c);
            }

            if (block?.type === 'chunk') {
                return buildChunkPreview(c);
            }

            if (block?.type === 'blend') {
                return buildBlendPreview(c);
            }

            if (block?.type === 'morph') {
                return buildMorphPreview(c, safeStep, steps);
            }

            return serializeBlock(block);
        };

        const buildPromptTimeline = (blocks, totalSteps) => {
            const steps = Math.max(1, Math.min(TIMELINE_MAX_STEPS, Number(totalSteps) || 20));
            const branches = splitBlocksByAnd(blocks);
            const segments = [];
            let currentText = null;
            let segmentStart = 1;

            for (let step = 1; step <= steps; step++) {
                const branchLines = branches
                    .map((branch, branchIndex) => {
                        const bindBlocks = branch.filter((b) => b?.type === 'bind');
                        const parts = branch
                            .filter((b) => b?.type !== 'bind')
                            .map((b) => resolveBlockAtStep(b, step, steps))
                            .filter((x) => normalizePreviewText(x) !== '');
                        const baseText = joinPromptParts(parts);
                        if (!bindBlocks.length) {
                            return baseText ? { index: branchIndex + 1, text: baseText } : null;
                        }
                        const bindParts = bindBlocks
                            .map((b) => {
                                const preview = resolveBlockAtStep(b, step, steps);
                                const rawWeight = String(b?.content?.weight ?? '').trim();
                                const weight = Number(rawWeight === '' ? 1 : rawWeight);
                                if (!preview) return '';
                                if (!Number.isFinite(weight) || Math.abs(weight - 1) <= 1e-8) return preview;
                                return `(${preview})*${compactNumber(weight, 4)}`;
                            })
                            .filter((x) => x !== '');
                        const text = [baseText, ...bindParts].filter(Boolean).join(' AND ');
                        return text ? { index: branchIndex + 1, text } : null;
                    })
                    .filter(Boolean);
                const line = branchLines.length > 1
                    ? branchLines.map((branch) => `B${branch.index}: ${branch.text}`).join(' || ')
                    : (branchLines[0]?.text || '');

                if (currentText === null) {
                    currentText = line;
                    segmentStart = step;
                    continue;
                }

                if (line !== currentText) {
                    segments.push({ from: segmentStart, to: step - 1, text: currentText });
                    currentText = line;
                    segmentStart = step;
                }
            }

            if (currentText === null) {
                segments.push({ from: 1, to: steps, text: '' });
            } else {
                segments.push({ from: segmentStart, to: steps, text: currentText });
            }

            return segments;
        };

        const buildBlockTimelineRows = (block, totalSteps) => {
            const steps = Math.max(1, Math.min(TIMELINE_MAX_STEPS, Number(totalSteps) || 20));
            const rows = [];
            let currentText = null;
            let start = 1;
            for (let step = 1; step <= steps; step++) {
                const nextText = resolveBlockAtStep(block, step, steps);
                if (currentText === null) {
                    currentText = nextText;
                    start = step;
                    continue;
                }
                if (nextText !== currentText) {
                    rows.push({ from: start, to: step - 1, text: currentText });
                    currentText = nextText;
                    start = step;
                }
            }
            rows.push({ from: start, to: steps, text: currentText ?? '' });
            return rows;
        };

        const scheduleRowsFromTimeline = (timeline, totalSteps) => {
            const steps = Math.max(1, Math.min(TIMELINE_MAX_STEPS, Number(totalSteps) || 20));
            const rows = [];
            let from = 1;
            const source = Array.isArray(timeline) && timeline.length ? timeline : [[steps, '']];

            source.forEach((item) => {
                const to = clampStep(Array.isArray(item) ? item[0] : steps, steps);
                const text = String(Array.isArray(item) ? (item[1] ?? '') : '');
                if (to < from) return;
                rows.push({ from, to, text });
                from = to + 1;
            });

            if (!rows.length) rows.push({ from: 1, to: steps, text: '' });
            if (rows[rows.length - 1].to < steps) {
                rows.push({
                    from: rows[rows.length - 1].to + 1,
                    to: steps,
                    text: rows[rows.length - 1].text
                });
            }
            return rows;
        };

        // --- BLOCKS ---

        // 1. TEXT / WEIGHT BLOCK
        const TextBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].text;
            const tc = TRANSLATIONS[lang].common;
            return (
                <div className="flex gap-3 items-start animate-in fade-in duration-300">
                    <div className="flex-1">
                        <AutoTextarea 
                            className="w-full bg-slate-900/50 p-3 rounded-lg border border-slate-700 text-sm focus:border-blue-500 outline-none font-sans text-blue-100 placeholder-slate-600 focus:bg-slate-900 min-h-[50px]"
                            placeholder={t.placeholder}
                            value={c.text}
                            onChange={e => onChange({...c, text: e.target.value})}
                            minHeight="50px"
                        />
                    </div>
                    <div className="w-40 shrink-0 flex flex-col gap-2">
                        <div className="flex bg-slate-900 rounded-lg p-1 border border-slate-700">
                            {['(', 'raw', '['].map(mode => (
                                <button 
                                    key={mode}
                                    onClick={() => onChange({...c, wrapper: mode})}
                                    className={`flex-1 py-1 text-[10px] rounded uppercase font-bold transition-all ${c.wrapper === mode ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-500 hover:text-white'}`}
                                >
                                    {mode === '(' ? '( )' : mode === '[' ? '[ ]' : 'Raw'}
                                </button>
                            ))}
                        </div>
                        {c.wrapper !== '[' && (
                            <div className="bg-slate-900/30 p-2 rounded-lg border border-slate-700/50">
                                <div className="flex justify-between text-[10px] mb-1 text-slate-400 uppercase font-bold">
                                    <span>{tc.weight}</span>
                                    <span className={`font-mono ${c.weight > 1 ? 'text-green-400' : c.weight < 1 ? 'text-red-400' : 'text-blue-400'}`}>{c.weight.toFixed(2)}</span>
                                </div>
                                <input 
                                    type="range" min="0.1" max="2.0" step="0.05" 
                                    value={c.weight} 
                                    onChange={e => onChange({...c, weight: parseFloat(e.target.value)})} 
                                    className="w-full"
                                />
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 2. HYBRID MIXER BLOCK
        const HybridBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].hybrid;
            const tc = TRANSLATIONS[lang].common;
            const updateItem = (i, field, val) => {
                const n = [...c.items];
                n[i] = { ...n[i], [field]: val };
                onChange({...c, items: n});
            };

            return (
                <div className="flex flex-col gap-3 animate-in fade-in duration-300">
                    <div className="text-xs text-pink-400 font-bold uppercase flex items-center border-b border-pink-900/30 pb-2">
                         <GitMerge size={14} className="mr-2"/> {t.title} <InfoTooltip text={t.tooltip} />
                    </div>
                    
                    <div className="space-y-2">
                        {c.items.map((item, idx) => (
                            <div key={idx} className="flex gap-2 items-start bg-slate-900/30 p-2 rounded-lg border border-slate-800 hover:border-pink-500/30 transition-colors group relative overflow-hidden">
                                <div 
                                    className="absolute bottom-0 left-0 top-0 bg-pink-500/5 pointer-events-none transition-all duration-300"
                                    style={{ width: `${(item.weight / 3.0) * 100}%` }}
                                ></div>

                                <AutoTextarea 
                                    className="flex-1 bg-transparent text-sm text-pink-100 placeholder-pink-900/50 outline-none z-10"
                                    placeholder={t.placeholder}
                                    value={item.text}
                                    onChange={e => updateItem(idx, 'text', e.target.value)}
                                />
                                <div className="w-px self-stretch bg-slate-700/50 mx-1"></div>
                                <div className="w-24 flex flex-col justify-center pt-1 z-10">
                                    <div className="flex justify-between text-[9px] uppercase font-bold text-slate-500 mb-1">
                                        <span>{tc.w_short}</span>
                                        <span className={`${item.weight > 1 ? 'text-pink-400' : item.weight < 1 ? 'text-slate-400' : 'text-blue-400'}`}>{item.weight.toFixed(2)}</span>
                                    </div>
                                    <input 
                                        type="range" min="0.1" max="3.0" step="0.05"
                                        value={item.weight}
                                        onChange={e => updateItem(idx, 'weight', parseFloat(e.target.value))}
                                        className="w-full h-1 accent-pink-500"
                                    />
                                </div>
                                <button onClick={() => onChange({...c, items: c.items.filter((_, i) => i !== idx)})} className="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1 mt-1 z-10">
                                    <X size={14}/>
                                </button>
                            </div>
                        ))}
                    </div>
                    
                    <button onClick={() => onChange({...c, items: [...c.items, {text: '', weight: 1.0}]})} className="w-full py-2 text-xs font-bold text-pink-500 border border-dashed border-pink-900/50 rounded-lg hover:bg-pink-900/10 transition-colors flex justify-center items-center gap-2">
                        <Plus size={14}/> {t.add}
                    </button>
                </div>
            )
        }

        // 3. SCHEDULE BLOCK
        const ScheduleBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].schedule;
            const mode = c.mode || 'postfix';
            const prompts = Array.isArray(c.prompts) && c.prompts.length ? c.prompts : [''];
            const rangesText = String(c.ranges || '');
            const parsedRanges = rangesText.split(',').map(x => x.trim()).filter(Boolean);

            const updatePrompt = (i, v) => {
                const n = [...prompts];
                n[i] = v;
                onChange({ ...c, prompts: n });
            };
            const setMode = (nextMode) => onChange({ ...c, mode: nextMode });
            const setRanges = (nextRanges) => onChange({ ...c, ranges: nextRanges });
            const addRangeToken = (token) => {
                const clean = String(token || '').trim();
                if (!clean) return;
                const next = parsedRanges.length ? `${parsedRanges.join(', ')}, ${clean}` : clean;
                setRanges(next);
            };
            const removeRangeAt = (idx) => {
                const next = parsedRanges.filter((_, i) => i !== idx);
                setRanges(next.join(', '));
            };
            const addCustomRange = () => {
                const a = String(c.rangeFrom || '').trim();
                const b = String(c.rangeTo || '').trim();
                if (!a || !b) return;
                const usePct = !!c.rangePct;
                addRangeToken(`${a}${usePct ? '%' : ''}-${b}${usePct ? '%' : ''}`);
                onChange({ ...c, rangeFrom: '', rangeTo: '', rangePct: usePct });
            };
            const quickRanges = (() => {
                const q = ['1%-25%', '25%-50%', '50%-75%', '75%-100%'];
                const n = Number(c.limit);
                if (Number.isFinite(n) && n > 1) {
                    const total = Math.max(4, Math.round(n));
                    const b1 = Math.max(1, Math.round(total * 0.25));
                    const b2 = Math.max(b1 + 1, Math.round(total * 0.5));
                    const b3 = Math.max(b2 + 1, Math.round(total * 0.75));
                    q.push(`1-${b1}`);
                    q.push(`${b1 + 1}-${b2}`);
                    q.push(`${b2 + 1}-${b3}`);
                    q.push(`${b3 + 1}-${total}`);
                } else {
                    q.push('1-4');
                    q.push('5-8');
                    q.push('9-12');
                    q.push('13-20');
                }
                return q;
            })();
            
            return (
                <div className="flex flex-col gap-3 animate-in fade-in duration-300">
                    <div className="flex justify-between items-center">
                        <div className="text-xs text-yellow-500 font-bold uppercase flex items-center">
                            {t.title} <InfoTooltip text={t.tooltip} />
                        </div>
                    </div>
                    <div className="bg-slate-900/40 p-2 rounded border border-slate-700/40">
                        <label className="text-[10px] uppercase text-slate-500 font-bold block mb-1">{t.mode}</label>
                        <div className="grid grid-cols-2 gap-2">
                            <button
                                type="button"
                                onClick={() => setMode('inner')}
                                className={`text-xs py-1.5 rounded border transition-colors ${mode === 'inner' ? 'bg-yellow-500/20 border-yellow-500/40 text-yellow-300' : 'bg-slate-900/50 border-slate-700 text-slate-400 hover:text-slate-200'}`}
                            >
                                {t.modeInner}
                            </button>
                            <button
                                type="button"
                                onClick={() => setMode('postfix')}
                                className={`text-xs py-1.5 rounded border transition-colors ${mode === 'postfix' ? 'bg-yellow-500/20 border-yellow-500/40 text-yellow-300' : 'bg-slate-900/50 border-slate-700 text-slate-400 hover:text-slate-200'}`}
                            >
                                {t.modePostfix}
                            </button>
                        </div>
                        <div className="text-[10px] text-slate-500 mt-2">
                            {mode === 'inner' ? t.modeInnerHint : t.modePostfixHint}
                        </div>
                    </div>

                    <div className="flex flex-col gap-2 bg-slate-900/30 p-2 rounded border border-slate-800 relative">
                        <div className="absolute left-[19px] top-4 bottom-4 w-0.5 bg-slate-700/50 -z-10"></div>
                        {prompts.map((p, idx) => (
                            <div key={idx} className="flex gap-2 items-center">
                                <div className="w-6 h-6 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-[10px] font-mono text-slate-400 z-10 shadow-sm">
                                    {idx}
                                </div>
                                <input 
                                    type="text" 
                                    className="flex-1 bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm focus:border-yellow-500 outline-none placeholder-slate-700 transition-colors"
                                    placeholder={idx === 0 ? t.startPlaceholder : t.nextPlaceholder}
                                    value={p}
                                    onChange={e => updatePrompt(idx, e.target.value)}
                                />
                                <button onClick={() => {
                                    const n = prompts.filter((_, i) => i !== idx);
                                    onChange({...c, prompts: n.length ? n : ['']});
                                }} className="text-slate-600 hover:text-red-400 p-1"><X size={14}/></button>
                            </div>
                        ))}
                        <button onClick={() => onChange({...c, prompts: [...prompts, '']})} className="ml-8 text-xs text-yellow-600 hover:text-yellow-400 flex items-center gap-1 transition-colors">
                            <Plus size={12}/> {t.add}
                        </button>
                    </div>

                    <div className="grid grid-cols-2 gap-3 bg-slate-800/30 p-2 rounded border border-slate-700/30">
                        <div>
                            <label className="text-[10px] uppercase text-slate-500 font-bold flex items-center">{t.endStep} <InfoTooltip text={t.endStepTooltip} /></label>
                            <input 
                                type="text" 
                                className="w-full bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm text-yellow-400 focus:border-yellow-500 outline-none font-mono"
                                placeholder={mode === 'inner' ? "e.g. 0.35 or 12" : "e.g. 20 or 0.5"}
                                value={c.limit}
                                onChange={e => onChange({...c, limit: e.target.value})}
                            />
                        </div>
                        <div>
                            <label className="text-[10px] uppercase text-slate-500 font-bold flex items-center">{t.ranges} <InfoTooltip text={t.rangesTooltip} /></label>
                            <input 
                                type="text" 
                                className="w-full bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm focus:border-blue-500 outline-none font-mono"
                                placeholder={mode === 'inner' ? "e.g. 1-4, 6-8 (inside [])" : "e.g. 1-4, 8-10"}
                                value={c.ranges}
                                onChange={e => onChange({...c, ranges: e.target.value})}
                            />
                        </div>
                    </div>

                    <div className="bg-slate-900/35 p-2 rounded border border-slate-700/30">
                        <div className="text-[10px] uppercase text-slate-500 font-bold mb-2">{t.quickRanges}</div>
                        <div className="flex flex-wrap gap-2 mb-2">
                            {quickRanges.map((token, i) => (
                                <button
                                    key={i}
                                    type="button"
                                    onClick={() => addRangeToken(token)}
                                    className="text-[10px] font-mono px-2 py-1 rounded border border-slate-700 text-slate-300 hover:text-white hover:border-blue-500/60 bg-slate-900/50"
                                >
                                    {token}
                                </button>
                            ))}
                        </div>
                        <div className="grid grid-cols-12 gap-2 items-end">
                            <div className="col-span-4">
                                <label className="text-[10px] uppercase text-slate-500 font-bold">{t.from}</label>
                                <input
                                    type="text"
                                    className="w-full bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm outline-none focus:border-blue-500 font-mono"
                                    placeholder="1"
                                    value={c.rangeFrom || ''}
                                    onChange={e => onChange({ ...c, rangeFrom: e.target.value })}
                                />
                            </div>
                            <div className="col-span-4">
                                <label className="text-[10px] uppercase text-slate-500 font-bold">{t.to}</label>
                                <input
                                    type="text"
                                    className="w-full bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm outline-none focus:border-blue-500 font-mono"
                                    placeholder="4"
                                    value={c.rangeTo || ''}
                                    onChange={e => onChange({ ...c, rangeTo: e.target.value })}
                                />
                            </div>
                            <label className="col-span-2 flex items-center gap-1 text-xs text-slate-300 cursor-pointer justify-center">
                                <input
                                    type="checkbox"
                                    checked={!!c.rangePct}
                                    onChange={e => onChange({ ...c, rangePct: e.target.checked })}
                                    className="accent-blue-500"
                                />
                                {t.pct}
                            </label>
                            <button
                                type="button"
                                onClick={addCustomRange}
                                className="col-span-2 text-xs py-1.5 rounded border border-blue-700/50 text-blue-300 hover:text-white hover:bg-blue-600/20"
                            >
                                {t.addRange}
                            </button>
                        </div>
                        {parsedRanges.length > 0 && (
                            <div className="mt-2">
                                <div className="flex flex-wrap gap-2">
                                    {parsedRanges.map((r, i) => (
                                        <button
                                            key={i}
                                            type="button"
                                            onClick={() => removeRangeAt(i)}
                                            className="text-[10px] font-mono px-2 py-1 rounded bg-slate-800 border border-slate-700 text-slate-300 hover:text-red-300 hover:border-red-700/50"
                                            title={lang === 'ru' ? 'Удалить диапазон' : 'Remove range'}
                                        >
                                            {r} ×
                                        </button>
                                    ))}
                                </div>
                                <button
                                    type="button"
                                    onClick={() => setRanges('')}
                                    className="mt-2 text-[10px] text-slate-500 hover:text-slate-300"
                                >
                                    {t.clearRanges}
                                </button>
                            </div>
                        )}
                    </div>
                    
                    <label className="flex items-center gap-2 text-xs text-slate-300 cursor-pointer select-none">
                        <input type="checkbox" checked={c.reverse} onChange={e => onChange({...c, reverse: e.target.checked})} className="rounded bg-slate-700 border-slate-600 accent-yellow-500"/>
                        {t.reverse}
                    </label>
                </div>
            );
        };

        // 4. ALTERNATE BLOCK
        const AlternateBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].alternate;
            const updateOpt = (i, v) => { const n = [...c.options]; n[i] = v; onChange({...c, options: n}); };

            return (
                <div className="flex flex-col gap-3 animate-in fade-in duration-300">
                    <div className="flex justify-between items-center border-b border-slate-700/50 pb-2">
                        <div className="text-xs text-green-500 font-bold uppercase flex items-center">
                            {t.title} <InfoTooltip text={t.tooltip} />
                        </div>
                        <div className="flex gap-3 items-center">
                            <div className="flex items-center gap-1 bg-slate-900 rounded p-1 border border-slate-700">
                                <span className="text-[10px] uppercase text-slate-500 px-1">{t.count}</span>
                                <input 
                                    type="number" min="1" 
                                    className="w-10 bg-transparent text-center text-sm font-bold outline-none text-green-400"
                                    value={c.count} onChange={e => onChange({...c, count: parseInt(e.target.value) || 1})}
                                />
                            </div>
                            <label className="flex items-center gap-1 text-xs cursor-pointer select-none text-green-300 bg-green-500/10 px-2 py-1 rounded border border-green-500/20 hover:bg-green-500/20 transition-colors">
                                <input type="checkbox" checked={c.distinct} onChange={e => onChange({...c, distinct: e.target.checked})} className="accent-green-500"/>
                                {t.distinct}
                            </label>
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                        {c.options.map((o, idx) => (
                            <div key={idx} className="flex relative group">
                                <input 
                                    type="text" 
                                    className="w-full bg-slate-900/50 p-1.5 pr-7 rounded border border-slate-700 text-sm focus:border-green-500 outline-none"
                                    placeholder={`${t.optionPlaceholder} ${idx+1}`}
                                    value={o}
                                    onChange={e => updateOpt(idx, e.target.value)}
                                />
                                <button 
                                    onClick={() => onChange({...c, options: c.options.filter((_, i) => i !== idx)})}
                                    className="absolute right-1 top-1.5 text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity"
                                >
                                    <X size={14}/>
                                </button>
                            </div>
                        ))}
                        <button onClick={() => onChange({...c, options: [...c.options, '']})} className="bg-slate-900/30 hover:bg-slate-800 border border-dashed border-slate-700 rounded text-slate-400 flex justify-center items-center py-1.5 transition-colors">
                            <Plus size={16}/> {t.add}
                        </button>
                    </div>
                </div>
            );
        };

        // 4.1 ALTERNATE1 BLOCK (a|b|c)
        const Alternate1Block = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].alternate1;
            const options = Array.isArray(c.options) && c.options.length ? c.options : ['', ''];
            const updateOpt = (i, v) => {
                const n = [...options];
                n[i] = v;
                onChange({ ...c, options: n });

        // 5. SEQUENCE BLOCK (IMPROVED with explanation)

                    </div>

                    {(c.type === 'deep' || c.type === 'top') && (

                            <div className="text-[10px] uppercase text-pink-400 font-bold flex items-center">
                                {c.type === 'deep' ? t.outer : t.trailing}
                                <InfoTooltip text={t.outerTooltip} />
                            </div>
                            {c.outer.map((item, idx) => (
                                <div key={idx} className="flex gap-1 group">
                                    <AutoTextarea 
                                        className="flex-1 bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm focus:border-pink-500 outline-none"
                                        value={item} 
                                        placeholder={t.outerPlaceholder}
                                        onChange={e => {const n = [...c.outer]; n[idx]=e.target.value; onChange({...c, outer: n})}}
                                    />
                                    <button onClick={() => onChange({...c, outer: c.outer.filter((_, i) => i !== idx)})} className="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100"><X size={14}/></button>
                                </div>
                            ))}
                            <button onClick={() => onChange({...c, outer: [...c.outer, '']})} className="text-xs text-pink-400 flex items-center gap-1 hover:text-pink-300"><Plus size={12}/> {t.addOuter}</button>
                        </div>
                    )}
                </div>
            );
        };

        // 6. GROUP BLOCK
        const GroupBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].group;
            return (
                <div className="flex flex-col gap-2 animate-in fade-in duration-300">
                    <div className="text-[10px] text-orange-400 uppercase font-bold mb-1 flex items-center">
                        {t.title} <InfoTooltip text={t.tooltip} />
                    </div>
                    <div className="bg-slate-900/30 p-2 rounded border border-slate-800">
                        {c.items.map((item, idx) => (
                            <div key={idx} className="flex gap-2 mb-2 last:mb-0 group">
                                <AutoTextarea 
                                    className="flex-1 bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm focus:border-orange-500 outline-none"
                                    placeholder={t.placeholder}
                                    value={item} onChange={e => {const n = [...c.items]; n[idx]=e.target.value; onChange({...c, items: n})}}
                                />
                                <button onClick={() => onChange({...c, items: c.items.filter((_, i) => i !== idx)})} className="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100"><X size={14}/></button>
                            </div>
                        ))}
                         <button onClick={() => onChange({...c, items: [...c.items, '']})} className="w-full mt-2 py-1 text-xs text-orange-400 border border-dashed border-orange-900/50 rounded hover:bg-orange-900/10 transition-colors">
                            + {t.add}
                        </button>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---

        const App = () => {
            const [lang, setLang] = useState('en');
            const [blocks, setBlocks] = useState(() => {
                try {
                    const saved = localStorage.getItem('pp21_builder_blocks');
                    return saved ? JSON.parse(saved) : EXAMPLES["simple"];
                } catch(e) { return EXAMPLES["simple"]; }
            });
            const [preview, setPreview] = useState('');
            const [examplesOpen, setExamplesOpen] = useState(false);
            const [isValid, setIsValid] = useState(true);
            const [lintMessages, setLintMessages] = useState([]);
            const [copied, setCopied] = useState(false);
            const [timelineSteps, setTimelineSteps] = useState(20);

            // Shorthand for current language translations
            const t = TRANSLATIONS[lang];

            const timelineSegments = useMemo(() => buildPromptTimeline(blocks, timelineSteps), [blocks, timelineSteps]);
            const scheduleTracks = useMemo(() => {
                return blocks
                    .map((b, idx) => {
                        if (!['schedule', 'interp', 'morph'].includes(b.type)) return null;
                        const rows = b.type === 'schedule'
                            ? scheduleRowsFromTimeline(buildScheduleTimeline(b.content || {}, timelineSteps), timelineSteps)
                            : buildBlockTimelineRows(b, timelineSteps);
                        return {
                            id: b.id,
                            index: idx + 1,
                            mode: (b.content?.mode || b.content?.easing || b.content?.curve || 'dynamic'),
                            label: b.type,
                            rows
                        };
                    })
                    .filter(Boolean);
            }, [blocks, timelineSteps]);

            useEffect(() => {
                localStorage.setItem('pp21_builder_blocks', JSON.stringify(blocks));
            }, [blocks]);

            useEffect(() => {
                const parts = blocks.map((b) => serializeBlock(b)).filter((x) => x !== '');
                const res = joinPromptParts(parts);
                 
                const openRound = (res.match(/\(/g) || []).length;
                const closeRound = (res.match(/\)/g) || []).length;
                const openSquare = (res.match(/\[/g) || []).length;
                const closeSquare = (res.match(/\]/g) || []).length;

                const lint = [];
                if (!res.trim()) lint.push({ level: 'err', text: lang === 'ru' ? 'Пустой prompt.' : 'Prompt is empty.' });
                if (openRound !== closeRound) lint.push({ level: 'err', text: lang === 'ru' ? 'Несбалансированные круглые скобки.' : 'Unbalanced round brackets.' });
                if (openSquare !== closeSquare) lint.push({ level: 'err', text: lang === 'ru' ? 'Несбалансированные квадратные скобки.' : 'Unbalanced square brackets.' });
                if (/^\s*AND\b/.test(res) || /\bAND\s*$/.test(res)) lint.push({ level: 'err', text: lang === 'ru' ? 'AND стоит на краю строки.' : 'AND appears at prompt edge.' });
                if (/\bAND\s+AND\b/.test(res)) lint.push({ level: 'err', text: lang === 'ru' ? 'Два AND подряд.' : 'Repeated AND connector.' });
                if (/\bBREAK\s+BREAK\b/.test(res)) lint.push({ level: 'warn', text: lang === 'ru' ? 'Два BREAK подряд.' : 'Repeated BREAK separator.' });

                blocks.forEach((b, idx) => {
                    const c = b.content || {};
                    if (b.type === 'sequence' && !String(c.owner || '').trim()) {
                        lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': sequence без owner.' : ': sequence has no owner.') });
                    }
                    if (b.type === 'schedule') {
                        const mode = c.mode || 'postfix';
                        const limit = String(c.limit || '').trim();
                        const prompts = Array.isArray(c.prompts) ? c.prompts : [];
                        const nonEmptyPrompts = prompts.filter((x) => String(x || '').trim() !== '');

                        if (nonEmptyPrompts.length < 2) {
                            lint.push({ level: 'warn', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': для schedule обычно нужно минимум 2 состояния.' : ': schedule usually needs at least 2 states.') });
                        }
                        if ((mode === 'inner' || mode === 'postfix') && !limit) {
                            lint.push({ level: 'warn', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': не задан N (boundary/end step).' : ': missing N (boundary/end step).') });
                        }
                        if (limit && parseBoundarySpec(limit, timelineSteps) === null) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Неверная boundary в блоке #' : 'Invalid boundary in block #') + (idx + 1) + `: ${limit}` });
                        }
                        const ranges = String(c.ranges || '').trim();
                        if (ranges) {
                            if (!limit) {
                                lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': интервалы заданы без N.' : ': ranges are set without N.') });
                            }
                            ranges.split(',').map(x => x.trim()).filter(Boolean).forEach((r) => {
                                const m = r.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+)%?)\s*-\s*([+-]?(?:\d+(?:\.\d+)?|\.\d+)%?)$/);
                                if (!m) {
                                    lint.push({ level: 'err', text: (lang === 'ru' ? 'Неверный range: ' : 'Invalid range: ') + r });
                                    return;
                                }
                                const a = m[1], b2 = m[2];
                                const aPct = a.endsWith('%');
                                const bPct = b2.endsWith('%');
                                if (aPct !== bPct) {
                                    lint.push({ level: 'err', text: (lang === 'ru' ? 'Смешанный percent-range: ' : 'Mixed percent-range: ') + r });
                                    return;
                                }
                                const av = parseFloat(a.replace('%', ''));
                                const bv = parseFloat(b2.replace('%', ''));
                                if (av > bv) {
                                    lint.push({ level: 'err', text: (lang === 'ru' ? 'reverse_range: ' : 'reverse_range: ') + r });
                                }
                            });
                        }
                    }
                    if (b.type === 'alternate') {
                        const hasEmpty = (c.options || []).some((x) => String(x).trim() === '');
                        if (hasEmpty) lint.push({ level: 'warn', text: (lang === 'ru' ? 'Пустые alternate-варианты в блоке #' : 'Empty alternate options in block #') + (idx + 1) });
                    }
                    if (b.type === 'alternate1') {
                        const options = Array.isArray(c.options) ? c.options : [];
                        if (options.length < 2) {
                            lint.push({ level: 'warn', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': alternate1 обычно требует минимум 2 варианта.' : ': alternate1 usually needs at least 2 options.') });
                        }
                        const hasEmpty = options.some((x) => String(x || '').trim() === '');
                        if (hasEmpty) {
                            lint.push({ level: 'warn', text: (lang === 'ru' ? 'Пустые alternate1-варианты в блоке #' : 'Empty alternate1 options in block #') + (idx + 1) });
                        }
                    }
                    if (b.type === 'alternate2') {
                        const tokens = (Array.isArray(c.options) ? c.options : []).map((x) => String(x || '').trim());
                        const nonEmpty = tokens.filter(Boolean);
                        if (nonEmpty.length < 2) {
                            lint.push({ level: 'warn', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': alternate2 обычно требует минимум 2 plain-токена.' : ': alternate2 usually needs at least 2 plain tokens.') });
                        }
                        const invalid = nonEmpty.find((x) => /[\[\]\{\}\(\),&:!]/.test(x));
                        if (invalid) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Недопустимый символ в alternate2: ' : 'Invalid symbol in alternate2: ') + invalid });
                        }
                    }
                    if (b.type === 'interp') {
                        const body = String(c.body || '').trim();
                        const start = Number(c.start);
                        const end = Number(c.end);
                        if (!body) lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': interpolation без тела.' : ': interpolation has no body.') });
                        if (!Number.isFinite(start) || !Number.isFinite(end)) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': interpolation требует два числа.' : ': interpolation needs both numeric weights.') });
                        }
                    }
                    if (b.type === 'pool') {

            const colors = {
                blue: 'bg-blue-500/10 text-blue-400 border-blue-500/20 hover:bg-blue-500/20',

                orange: 'bg-orange-500/10 text-orange-400 border-orange-500/20 hover:bg-orange-500/20',
                pink: 'bg-pink-500/10 text-pink-400 border-pink-500/20 hover:bg-pink-500/20',
                emerald: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20 hover:bg-emerald-500/20',
                sky: 'bg-sky-500/10 text-sky-400 border-sky-500/20 hover:bg-sky-500/20',
                cyan: 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20 hover:bg-cyan-500/20',
                fuchsia: 'bg-fuchsia-500/10 text-fuchsia-400 border-fuchsia-500/20 hover:bg-fuchsia-500/20',
                amber: 'bg-amber-500/10 text-amber-400 border-amber-500/20 hover:bg-amber-500/20',
                violet: 'bg-violet-500/10 text-violet-400 border-violet-500/20 hover:bg-violet-500/20',
                gray: 'bg-slate-700/30 text-slate-300 border-slate-600/50 hover:bg-slate-700/50',
            };
            return (
                <button 
                    onClick={onClick}
                    className={`flex items-center gap-2 px-3 py-2 rounded-lg border text-xs font-bold transition-all shadow-sm active:scale-95 ${colors[color]}`}
                >
                    {React.cloneElement(icon, { size: 14 })} {label}
                </button>
            )
        };

        const getBlockIcon = (type) => {
            switch(type) {
                case 'text': return <Zap size={14} className="text-blue-400"/>;
                case 'hybrid': return <GitMerge size={14} className="text-pink-400"/>;
                case 'schedule': return <Clock size={14} className="text-yellow-400"/>;
                case 'alternate': return <Shuffle size={14} className="text-green-400"/>;
                case 'alternate1': return <Shuffle size={14} className="text-emerald-400"/>;
                case 'alternate2': return <Shuffle size={14} className="text-cyan-400"/>;
                case 'interp': return <Beaker size={14} className="text-fuchsia-400"/>;
                case 'pool': return <Globe size={14} className="text-emerald-400"/>;
                case 'bind': return <span className="text-rose-400 font-bold text-xs">=&gt;</span>;
                case 'assemble': return <LayoutTemplate size={14} className="text-sky-400"/>;
                case 'chunk': return <Split size={14} className="text-amber-400"/>;
                case 'blend': return <span className="text-cyan-400 font-bold text-xs">Σ</span>;
                case 'morph': return <RefreshCw size={14} className="text-violet-400"/>;
                case 'sequence': return <Layers size={14} className="text-indigo-400"/>;
                case 'group': return <Box size={14} className="text-orange-400"/>;
                case 'and': return <span className="text-pink-400 font-bold text-xs">&</span>;
                case 'break': return <Split size={14} className="text-slate-400"/>;
                default: return <Code size={14}/>;
            }
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
