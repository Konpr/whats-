                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': interpolation требует минимум два числовых веса.' : ': interpolation needs at least two numeric weights.') });
                        }
                    }
                    if (b.type === 'pool') {
                        const body = String(c.body || '').trim();
                        if (!body) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': POOL требует непустое тело.' : ': POOL needs a non-empty body.') });
                        }
                        if (hasBackendMarker(body, 'POOL')) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'POOL body не должен содержать same-type POOL внутри POOL в блоке #' : 'POOL body must not contain same-type POOL inside POOL in block #') + (idx + 1) });
                        }
                    }
                    if (b.type === 'bind') {
                        const owner = String(c.owner || '').trim();
                        const attrs = String(c.attrs || '').trim();
                        const rawWeight = String(c.weight ?? '').trim();
                        const weight = Number(rawWeight === '' ? 1 : rawWeight);
                        if (!owner || !attrs) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': BIND требует непустые owner и attrs.' : ': BIND needs non-empty owner and attrs.') });
                        }
                        if (rawWeight !== '' && (!Number.isFinite(weight) || weight <= 0)) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'BIND weight должен быть положительным числом в блоке #' : 'BIND weight must be a positive number in block #') + (idx + 1) });
                        }
                        if (hasBackendMarker(owner, 'BIND', true) || hasBackendMarker(attrs, 'BIND', true)) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Owner/attrs BIND не должны содержать same-type BIND внутри BIND в блоке #' : 'BIND owner/attrs must not contain same-type BIND inside BIND in block #') + (idx + 1) });
                        }
                        if (hasTopLevelAndInText(owner) || hasTopLevelAndInText(attrs)) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Owner и attrs у BIND не должны содержать top-level AND в блоке #' : 'BIND owner and attrs must not contain top-level AND in block #') + (idx + 1) });
                        }
                    }
                    if (b.type === 'bind2') {
                        const owner = String(c.owner || '').trim();
                        const ownerBlocks = Array.isArray(c.ownerBlocks) && c.ownerBlocks.length > 0;
                        const resolvedOwner = ownerBlocks || owner;
                        const attrs = Array.isArray(c.attrs) ? c.attrs.filter(a => String(a || '').trim()) : [];
                        const attrsBlocks = Array.isArray(c.attrsBlocks) ? c.attrsBlocks : [];
                        const hasBlockAttr = attrsBlocks.some(slot => Array.isArray(slot) && slot.length > 0);
                        if (!resolvedOwner) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': BIND2 требует непустого owner.' : ': BIND2 needs a non-empty owner.') });
                        }
                        if (attrs.length < 1 && !hasBlockAttr) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': BIND2 требует хотя бы один attr.' : ': BIND2 needs at least one attr.') });
                        }
                    }
                    if (b.type === 'bind3') {
                        const owner = String(c.owner || '').trim();
                        const ownerBlocks = Array.isArray(c.ownerBlocks) && c.ownerBlocks.length > 0;
                        const resolvedOwner = ownerBlocks || owner;
                        const rawAttrs = Array.isArray(c.attrs) ? c.attrs : [];
                        const attrsBlocks = Array.isArray(c.attrsBlocks) ? c.attrsBlocks : [];
                        const hasBlockAttr = attrsBlocks.some(slot => Array.isArray(slot) && slot.length > 0);
                        if (!resolvedOwner) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': BIND3 требует непустого owner.' : ': BIND3 needs a non-empty owner.') });
                        }
                        const texts = [];
                        const hasSched = [];
                        rawAttrs.forEach((a, i) => {
                            const text = String(typeof a === 'string' ? a : (a?.text || '')).trim();
                            const schedText = String(a?.schedText || '').trim();
                            const schedLimit = String(a?.schedLimit || '').trim();
                            const gathered = (blocks && attrsBlocks[i] && attrsBlocks[i].length > 0)
                                ? attrsBlocks[i].map(b => serializeBlock({ type: b.type, content: b.content })).join(' ')
                                : text;
                            if (!gathered) return;
                            texts.push(gathered);
                            hasSched.push(!!(schedText && schedLimit));
                        });
                        if (texts.length < 1 && !hasBlockAttr) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': BIND3 требует хотя бы один attr.' : ': BIND3 needs at least one attr.') });
                        }
                        if (texts.length >= 1 && hasSched.some(Boolean)) {
                            const counts = texts.map((t) => approxTokenCount(t));
                            const distinctCounts = [...new Set(counts)].length;
                            if (distinctCounts > 1) {
                                lint.push({ level: 'warn', text: (lang === 'ru' ? 'BIND3 scheduling: атрибуты должны содержать одинаковое кол-во токенов в блоке #' : 'BIND3 scheduling: attrs must have equal token counts in block #') + (idx + 1) + ` (${counts.join(' vs ')})` });
                            }
                        }
                    }
                    if (b.type === 'diff') {
                        const base = String(c.base || '').trim();
                        const baseBlocks = Array.isArray(c.baseBlocks) && c.baseBlocks.length > 0;
                        const resolvedBase = baseBlocks || base;
                        const terms = Array.isArray(c.terms) ? c.terms : [];
                        const termBlocks = Array.isArray(c.termBlocks) ? c.termBlocks : [];
                        const validTerm = terms.some((t, i) => {
                            const text = String(t?.text || '').trim();
                            const blocks = Array.isArray(termBlocks[i]) && termBlocks[i].length > 0;
                            return text || blocks;
                        });
                        if (!resolvedBase) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': DIFF требует непустого base.' : ': DIFF needs a non-empty base.') });
                        }
                        if (!validTerm) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': DIFF требует хотя бы один term.' : ': DIFF needs at least one term.') });
                        }
                        terms.forEach((term) => {
                            const weight = Number(term.weight ?? 1);
                            if (!Number.isFinite(weight)) {
                                lint.push({ level: 'err', text: (lang === 'ru' ? 'DIFF term weight должен быть числом в блоке #' : 'DIFF term weight must be a number in block #') + (idx + 1) });
                            }
                        });
                    }
                    if (b.type === 'compound') {
                        const base = String(c.base || '').trim();
                        const parts = Array.isArray(c.parts) ? c.parts : [];

                if (b.type === 'random_wildcard') {
                    const f = String(c.file || '').trim();
                    return f ? `<random:${f}>` : '(empty)';
                }
                if (b.type === 'wildcard_double') {
                    const t = String(c.term || '').trim();
                    return t ? `__${t}__` : '(empty)';

                if (b.type === 'cfg_schedule') {
                    const ws = Array.isArray(c.weights) ? c.weights.join('->') : '';
                    return ws ? `cfg: ${ws}` : '(empty)';
                }
                if (b.type === 'usevar') {

                            <Btn icon={<span className="font-bold text-xs">Tg</span>} label={t.toolbar.toneg} color="red" onClick={() => addBlock('toneg')} />
                            <Btn icon={<span className="font-bold text-xs">P</span>} label={t.toolbar.param} color="slate" onClick={() => addBlock('param')} />
                            <Btn icon={<span className="font-bold text-xs">CF</span>} label={t.toolbar.cfg_schedule} color="sky" onClick={() => addBlock('cfg_schedule')} />
                            <Btn icon={<span className="font-bold text-xs">Sv</span>} label={t.toolbar.setvar} color="slate" onClick={() => addBlock('setvar')} />
                            <Btn icon={<span className="font-bold text-xs">Sm</span>} label={t.toolbar.setmacro} color="slate" onClick={() => addBlock('setmacro')} />
                            <Btn icon={<span className="font-bold text-xs">Rd</span>} label={t.toolbar.random_wildcard} color="slate" onClick={() => addBlock('random_wildcard')} />
                            <Btn icon={<span className="font-bold text-xs">W</span>} label={t.toolbar.wildcard_double} color="slate" onClick={() => addBlock('wildcard_double')} />
                            <Btn icon={<span className="font-bold text-xs">UV</span>} label={t.toolbar.usevar} color="amber" onClick={() => addBlock('usevar')} />
                            <div className="w-px bg-slate-700/50 mx-1"></div>
                            <Btn icon={<span className="font-bold">&</span>} label={t.toolbar.and} color="gray" onClick={() => addBlock('and')} />
                            <Btn icon={<Split/>} label={t.toolbar.break} color="gray" onClick={() => addBlock('break')} />
                            <div className="flex-1"></div>
                            <button onClick={() => {if(confirm(t.toolbar.clearConfirm)) setBlocks([])}} className="px-3 py-1.5 text-xs font-bold text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-lg transition-colors flex items-center gap-1">
                                <Trash2 size={14}/>
                            </button>
                        </div>

                        <div className="bg-slate-900/55 border border-slate-700/40 rounded-xl p-4 mb-6">
                            <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-3 mb-4">
                                <div>
                                    <h3 className="text-sm font-bold uppercase tracking-wider text-slate-200">{guide.title}</h3>
                                    <div className="text-xs text-slate-400 mt-1">{guide.subtitle}</div>
                                </div>
                                <div className="text-[10px] uppercase tracking-[0.2em] text-slate-500">{guide.chooseTitle}</div>
                            </div>
                            <div className="grid lg:grid-cols-[1.5fr_1fr] gap-4">
                                <div className="grid md:grid-cols-2 gap-3">
                                    {guideCards.map((card) => {
                                                const info = guide.cards[card.key];
                                                return (
                                            <div key={card.key} className={`rounded-xl border p-3 ${accentMap[card.accent] || 'border-slate-700 bg-slate-800/30 text-slate-200'}`}>
                                                <div className="flex items-center gap-2 text-xs font-bold uppercase tracking-wider mb-2">
                                                    <span className="shrink-0 inline-flex items-center justify-center">{card.icon}</span> {info.title}
                                                </div>
                                                <div className="text-sm font-semibold mb-2">{info.purpose}</div>
                                                <div className="text-xs leading-relaxed text-slate-200/90 mb-2">{info.when}</div>
                                                <div className="text-[11px] font-mono bg-black/20 border border-white/10 rounded px-2 py-1 break-all text-slate-100">{info.example}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="grid gap-3">
                                    <div className="rounded-xl border border-slate-700/50 bg-slate-950/35 p-3">
                                        <div className="text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">{guide.previewTitle}</div>
                                        <ul className="space-y-2 text-xs text-slate-300 leading-relaxed">
                                            <li>• {guide.previewPrompt}</li>
                                            <li>• {guide.previewTimeline}</li>
                                            <li>• {guide.previewLint}</li>
                                            <li>• {guide.previewAnd}</li>
                                        </ul>
                                    </div>
                                    <div className="rounded-xl border border-slate-700/50 bg-slate-950/35 p-3">
                                        <div className="text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">{guide.limitsTitle}</div>
                                        <ul className="space-y-2 text-xs text-slate-300 leading-relaxed">
                                            <li>• {guide.limits.poolLimit}</li>
                                            <li>• {guide.limits.oneBackend}</li>
                                            <li>• {guide.limits.safeSugar}</li>
                                            <li>• {guide.limits.wrappers}</li>
                                            <li>• {guide.limits.blendNested}</li>
                                            <li>• {guide.limits.innerGrammar}</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* PRO LINT + COACH */}
                        <div className="grid md:grid-cols-2 gap-4 mb-6">
                            <div className="bg-slate-900/55 border border-slate-700/40 rounded-xl p-4">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-sm font-bold uppercase tracking-wider text-slate-300">
                                        {lang === 'ru' ? 'Parser Lint' : 'Parser Lint'}
                                    </h3>
                                    <span className={`text-xs font-mono px-2 py-1 rounded ${errCount ? 'bg-red-900/30 text-red-300' : warnCount ? 'bg-yellow-900/30 text-yellow-300' : 'bg-green-900/30 text-green-300'}`}>
                                        ERR {errCount} / WARN {warnCount}
                                    </span>
                                </div>
                                <ul className="space-y-1 text-xs">
                                    {lintMessages.slice(0, 8).map((item, i) => (
                                        <li key={i} className={
                                            item.level === 'err' ? 'text-red-300' :
                                            item.level === 'warn' ? 'text-yellow-300' :
                                            'text-green-300'
                                        }>
                                            {item.level === 'err' ? '• [ERR] ' : item.level === 'warn' ? '• [WARN] ' : '• [OK] '}
                                            {item.text}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            <div className="bg-slate-900/55 border border-slate-700/40 rounded-xl p-4">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-sm font-bold uppercase tracking-wider text-slate-300">Pro Coach</h3>
                                    <span className="text-xs font-mono px-2 py-1 rounded bg-blue-900/30 text-blue-300">
                                        Score {coachScore}/100
                                    </span>
                                </div>
                                <ul className="space-y-1 text-xs text-slate-300">
                                    {coachTips.map((tip, i) => <li key={i}>• {tip}</li>)}
                                </ul>
                            </div>
                        </div>

                        {/* STEP TIMELINE */}
                        <div className="bg-slate-900/55 border border-slate-700/40 rounded-xl p-4 mb-6">
                            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-3">
                                <div>
                                    <h3 className="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center">
                                        {t.timeline.title} <InfoTooltip text={t.timeline.tooltip} />
                                    </h3>
                                    <div className="text-[10px] text-slate-500 mt-1">{t.timeline.note}</div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="text-[10px] uppercase text-slate-500 font-bold">{t.timeline.steps}</span>
                                    <input
                                        type="number"
                                        min="1"
                                        max={TIMELINE_MAX_STEPS}
                                        value={timelineSteps}
                                        onChange={(e) => {
                                            const next = Math.max(1, Math.min(TIMELINE_MAX_STEPS, parseInt(e.target.value, 10) || 1));
                                            setTimelineSteps(next);
                                        }}
                                        className="w-20 bg-slate-950/60 border border-slate-700 rounded px-2 py-1 text-sm text-slate-200 font-mono outline-none focus:border-blue-500"
                                    />
                                    <span className="text-[10px] font-mono px-2 py-1 rounded bg-blue-900/20 text-blue-300">
                                        {t.timeline.segments}: {timelineSegments.length}
                                    </span>
                                </div>
                            </div>

                            {scheduleTracks.length === 0 && (
                                <div className="text-xs text-slate-500 mb-3">{t.timeline.noDynamic}</div>
                            )}

                            {scheduleTracks.length > 0 && (
                                <div className="space-y-2 mb-4">
                                    {scheduleTracks.map((track) => (
                                        <div key={track.id} className="bg-slate-950/40 border border-slate-800 rounded-lg p-2">
                                            <div className="text-[10px] uppercase tracking-wide text-slate-500 font-bold mb-1">
                                                #{track.index} {t.timeline.block}: {track.label} ({track.mode})
                                            </div>
                                            <div className="max-h-28 overflow-auto space-y-1">
                                                {track.rows.map((row, i) => (
                                                    <div key={i} className="grid grid-cols-[56px_56px_1fr] gap-2 text-[11px] font-mono">
                                                        <div className="text-slate-400">{row.from}</div>
                                                        <div className="text-slate-400">{row.to}</div>
                                                        <div className="text-yellow-300 break-all">{row.text || t.timeline.empty}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div className="bg-slate-950/40 border border-slate-800 rounded-lg overflow-hidden">
                                <div className="grid grid-cols-[56px_56px_1fr] gap-2 px-3 py-2 text-[10px] uppercase tracking-wide text-slate-500 font-bold border-b border-slate-800">
                                    <div>{t.timeline.from}</div>
                                    <div>{t.timeline.to}</div>
                                    <div>{t.timeline.value}</div>
                                </div>
                                <div className="max-h-56 overflow-auto">
                                    {timelineSegments.map((seg, i) => (
                                        <div key={i} className="grid grid-cols-[56px_56px_1fr] gap-2 px-3 py-1.5 text-[11px] font-mono border-b border-slate-900 last:border-0">
                                            <div className="text-slate-400">{seg.from}</div>
                                            <div className="text-slate-400">{seg.to}</div>
                                            <div className="text-blue-300 break-all">{seg.text || t.timeline.empty}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* BLOCK TREE (hierarchical view) */}
                        <BlockTreeSection blocks={blocks} lang={lang} />

                        {/* WORKSPACE */}
                        <div className="space-y-4 mb-40">
                            {blocks.length === 0 && (
                                <div className="border-2 border-dashed border-slate-800/50 rounded-2xl p-20 text-center text-slate-600 flex flex-col items-center gap-6 animate-in fade-in zoom-in-95">
                                    <div className="w-20 h-20 bg-slate-900/50 rounded-full flex items-center justify-center">
                                        <Beaker size={40} className="opacity-30"/>
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-500">{t.common.workspaceEmpty}</h3>
                                        <p className="text-sm">{t.common.selectBlock}</p>
                                    </div>
                                </div>
                            )}
                            
                            {blocks.map((block, idx) => (
                                <div key={block.id} className="block-card bg-slate-800/20 border border-slate-700/30 rounded-xl overflow-hidden relative group backdrop-blur-sm">
                                    {/* Block Header */}
                                    <div className="bg-slate-900/40 px-3 py-2 flex justify-between items-center border-b border-slate-700/30 select-none" onDoubleClick={() => toggleCollapse(block.id)}>
                                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => toggleCollapse(block.id)}>
                                            <div className="p-1 rounded hover:bg-slate-700/50 transition-colors">
                                                {block.collapsed ? <ChevronDown size={14} className="text-slate-400"/> : <ChevronUp size={14} className="text-slate-400"/>}
                                            </div>
                                            <div className="flex items-center gap-2">
                                                {getBlockIcon(block.type)}
                                                <span className="text-[10px] font-bold uppercase tracking-widest text-slate-500">{block.type}</span>
                                            </div>
                                            {block.collapsed && (
                                                <span className="text-xs text-slate-600 truncate max-w-[200px] opacity-0 group-hover:opacity-100 transition-opacity">
                                                    {getSummary(block)}
                                                </span>
                                            )}
                                        </div>
                                        <div className="flex items-center gap-1 opacity-10 group-hover:opacity-100 transition-opacity">
                                            <button onClick={() => moveBlock(idx, -1)} className="p-1.5 hover:bg-slate-700 rounded text-slate-400 hover:text-white"><MoveUp size={12}/></button>
                                            <button onClick={() => moveBlock(idx, 1)} className="p-1.5 hover:bg-slate-700 rounded text-slate-400 hover:text-white"><MoveDown size={12}/></button>
                                            <button onClick={() => removeBlock(block.id)} className="p-1.5 hover:bg-red-900/30 rounded hover:text-red-500 text-slate-400"><Trash2 size={12}/></button>
                                        </div>
                                    </div>
                                    
                                    {/* Block Content */}
                                    {!block.collapsed && (
                                        <div className="p-4">
                                            {block.type === 'text' && <TextBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'hybrid' && <HybridBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'schedule' && <ScheduleBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'alternate' && <AlternateBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'alternate1' && <Alternate1Block c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'alternate2' && <Alternate2Block c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'interp' && <InterpBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'pool' && <PoolBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'bind' && <BindBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'bind2' && <Bind2Block c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'bind3' && <Bind3Block c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'diff' && <DiffBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'compound' && <CompoundBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'assemble' && <AssembleBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'chunk' && <ChunkBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'blend' && <BlendBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'morph' && <MorphBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'sequence' && <SequenceBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'group' && <GroupBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            
                                            {block.type === 'and' && <div className="text-center font-bold text-pink-500 text-sm tracking-widest py-2">--- {t.separators.and} ---</div>}
                                            {block.type === 'break' && <div className="text-center font-bold text-slate-500 text-sm tracking-widest py-2">=== {t.separators.break} ===</div>}
                                            {block.type === 'toneg' && <ToneGBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'param' && <ParamBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} blockType="param" />}
                                            {block.type === 'setvar' && <ParamBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} blockType="setvar" />}
                                            {block.type === 'setmacro' && <ParamBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} blockType="setmacro" />}
                                            {block.type === 'random_wildcard' && <WildcardBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'wildcard_double' && <WildcardDoubleBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'cfg_schedule' && <CFGScheduleBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                            {block.type === 'usevar' && <UseVarBlock c={block.content} onChange={c => updateBlock(block.id, c)} lang={lang} />}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>

                        {/* RESULT FOOTER */}
                        <div className="fixed bottom-0 left-0 w-full bg-[#020617]/90 backdrop-blur-xl border-t border-slate-700/50 p-4 z-50 shadow-2xl">
                            <div className="max-w-5xl mx-auto flex gap-4 items-stretch">
                                <div className="flex-1 relative group">
                                    <textarea 
                                        readOnly 
                                        value={preview} 
                                        className={`w-full h-24 bg-slate-950/50 p-4 rounded-xl border ${isValid ? 'border-slate-700/50' : 'border-red-900/50'} font-mono text-sm text-blue-300 focus:outline-none resize-none shadow-inner`}
                                    />
                                    <div className="absolute top-3 right-3 flex flex-col items-end gap-1">
                                        {!isValid && <span className="text-red-500 text-xs font-bold flex items-center gap-1 bg-red-900/20 px-2 py-1 rounded"><AlertCircle size={12}/> {t.common.syntaxError}</span>}
                                        <div className="text-[10px] text-slate-600 font-mono">{preview.length} {t.common.chars} | ERR {errCount} | WARN {warnCount}</div>
                                    </div>
                                </div>
                                <button 
                                    onClick={handleCopy}
                                    className={`w-24 font-bold rounded-xl flex flex-col items-center justify-center gap-1 transition-all shadow-lg active:scale-95 ${copied ? 'bg-green-600 text-white' : 'bg-gradient-to-br from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white'}`}
                                >
                                    {copied ? <CheckCircle2 size={20}/> : <Copy size={20}/>}
                                    <span className="text-xs">{copied ? t.common.copied : t.common.copy}</span>
                                </button>
                             </div>
                        </div>
                    </div>
                </div>
                <CurvePreviewModal
                    open={showCurvePreview}
                    onClose={() => setShowCurvePreview(false)}
                    curves={{
                        linear: "linear", ease: "ease", "ease-in": "ease-in", "ease-out": "ease-out",
                        "ease-in-out": "ease-in-out", bezier: "bezier", catmull: "catmull",
                        "sine-in": "sine-in", "sine-out": "sine-out", "sine-in-out": "sine-in-out",
                        "quart-in": "quart-in", "quart-out": "quart-out", "quart-in-out": "quart-in-out",
                        "quint-in": "quint-in", "quint-out": "quint-out", "quint-in-out": "quint-in-out",
                        "expo-in": "expo-in", "expo-out": "expo-out", "expo-in-out": "expo-in-out",
                        "circ-in": "circ-in", "circ-out": "circ-out", "circ-in-out": "circ-in-out",
                        "back-in": "back-in", "back-out": "back-out", "back-in-out": "back-in-out",
                        bounce: "bounce",
                        slerp: "slerp"
                    }}
                    selected={previewCurve}
                    onSelect={setPreviewCurve}
                />
            </>);
        };

        // Helpers
        const Btn = ({ icon, label, color, onClick }) => {
            const colors = {
                blue: 'bg-blue-500/10 text-blue-400 border-blue-500/20 hover:bg-blue-500/20',
                yellow: 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20 hover:bg-yellow-500/20',
                green: 'bg-green-500/10 text-green-400 border-green-500/20 hover:bg-green-500/20',
                indigo: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20 hover:bg-indigo-500/20',
                orange: 'bg-orange-500/10 text-orange-400 border-orange-500/20 hover:bg-orange-500/20',
                pink: 'bg-pink-500/10 text-pink-400 border-pink-500/20 hover:bg-pink-500/20',
                emerald: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20 hover:bg-emerald-500/20',
                sky: 'bg-sky-500/10 text-sky-400 border-sky-500/20 hover:bg-sky-500/20',
                cyan: 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20 hover:bg-cyan-500/20',
                fuchsia: 'bg-fuchsia-500/10 text-fuchsia-400 border-fuchsia-500/20 hover:bg-fuchsia-500/20',
                amber: 'bg-amber-500/10 text-amber-400 border-amber-500/20 hover:bg-amber-500/20',
                violet: 'bg-violet-500/10 text-violet-400 border-violet-500/20 hover:bg-violet-500/20',
                gray: 'bg-slate-700/30 text-slate-300 border-slate-600/50 hover:bg-slate-700/50',
            };
            return (
                <button 
                    onClick={onClick}
                    className={`flex items-center gap-2 px-3 py-2 rounded-lg border text-xs font-bold transition-all shadow-sm active:scale-95 ${colors[color]}`}
                >
                    {React.cloneElement(icon, { size: 14 })} {label}
                </button>
            )
        };

        const getBlockIcon = (type) => {
            switch(type) {
                case 'text': return <Zap size={14} className="text-blue-400"/>;
                case 'hybrid': return <GitMerge size={14} className="text-pink-400"/>;
                case 'schedule': return <Clock size={14} className="text-yellow-400"/>;
                case 'alternate': return <Shuffle size={14} className="text-green-400"/>;
                case 'alternate1': return <Shuffle size={14} className="text-emerald-400"/>;
                case 'alternate2': return <Shuffle size={14} className="text-cyan-400"/>;
                case 'interp': return <Beaker size={14} className="text-fuchsia-400"/>;
                case 'pool': return <Globe size={14} className="text-emerald-400"/>;
                case 'bind': return <span className="text-rose-400 font-bold text-xs">=&gt;</span>;
                case 'bind2': return <span className="text-violet-400 font-bold text-xs">B2</span>;
                case 'bind3': return <span className="text-pink-400 font-bold text-xs">B3</span>;
                case 'diff': return <span className="text-orange-400 font-bold text-xs">Df</span>;
                case 'compound': return <span className="text-emerald-400 font-bold text-xs">Cp</span>;
                case 'assemble': return <LayoutTemplate size={14} className="text-sky-400"/>;
                case 'chunk': return <Split size={14} className="text-amber-400"/>;
                case 'blend': return <span className="text-cyan-400 font-bold text-xs">Σ</span>;
                case 'morph': return <RefreshCw size={14} className="text-violet-400"/>;
                case 'sequence': return <Layers size={14} className="text-indigo-400"/>;
                case 'group': return <Box size={14} className="text-orange-400"/>;
                        case 'and': return <span className="text-pink-400 font-bold text-xs">&</span>;
                case 'break': return <Split size={14} className="text-slate-400"/>;
                case 'toneg': return <span className="text-rose-400 font-bold text-xs">T-</span>;
                case 'param': return <span className="text-cyan-400 font-bold text-xs">P</span>;
                case 'setvar': return <span className="text-yellow-400 font-bold text-xs">V</span>;
                case 'setmacro': return <span className="text-orange-400 font-bold text-xs">M</span>;
                case 'random_wildcard': return <span className="text-emerald-400 font-bold text-xs">W</span>;
                case 'wildcard_double': return <span className="text-green-400 font-bold text-xs">W2</span>;
                case 'cfg_schedule': return <span className="text-sky-400 font-bold text-xs">CF</span>;
                case 'usevar': return <span className="text-amber-400 font-bold text-xs">UV</span>;
                default: return <Code size={14}/>;
            }
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
