        const AutoTextarea = ({ value, onChange, placeholder, className, minHeight = "36px" }) => {
            return (
                <textarea

                    placeholder={placeholder}
                    value={value}
                    onChange={e => {
                        e.target.style.height = 'auto';
                        e.target.style.height = e.target.scrollHeight + 'px';
                        onChange(e);

                    rows={1}
                    style={{ overflow: 'hidden', resize: 'none', minHeight: minHeight }}

        const joinPromptParts = (parts) => {
            let res = (parts || []).join(', ');
            res = res.replace(/,  AND ,/g, ' AND ')
                     .replace(/,  AND /g, ' AND ')
                     .replace(/ AND ,/g, ' AND ')
                     .replace(/,  BREAK ,/g, ' BREAK ')
                     .replace(/,  BREAK /g, ' BREAK ')
                     .replace(/ BREAK ,/g, ' BREAK ')
                     .replace(/,\s*(BIND(?:\^[^{,\s]+)?\{)/g, ' $1')
                     .replace(/,\s*(DIFF(?:\^[^{,\s]+)?\{)/g, ' $1')
                     .replace(/\s+/g, ' ')
                     .trim();
            return res;
        };

        const splitBlocksByAnd = (blocks) => {
            const branches = [];
            let current = [];
            (Array.isArray(blocks) ? blocks : []).forEach((block) => {
                if (block?.type === 'and') {
                    branches.push(current);
                    current = [];
                    return;
                }
                current.push(block);
            });
            branches.push(current);
            return branches;
        };

        const resolveBlockAtStep = (block, step, totalSteps, useScheduling = true) => {

        const buildPromptTimeline = (blocks, totalSteps, seed, useScheduling) => {

            return segments;
        };

        const buildBlockTimelineRows = (block, totalSteps, useScheduling) => {
            const steps = Math.max(1, Math.min(TIMELINE_MAX_STEPS, Number(totalSteps) || 20));
            const rows = [];
            let currentText = null;
            let start = 1;
            for (let step = 1; step <= steps; step++) {
                const nextText = resolveBlockAtStep(block, step, steps, useScheduling);
                if (currentText === null) {
                    currentText = nextText;
                    start = step;
                    continue;
                }
                if (nextText !== currentText) {
                    rows.push({ from: start, to: step - 1, text: currentText });
                    currentText = nextText;
                    start = step;
                }
            }
            rows.push({ from: start, to: steps, text: currentText ?? '' });
            return rows;
        };

        const scheduleRowsFromTimeline = (timeline, totalSteps) => {
            const steps = Math.max(1, Math.min(TIMELINE_MAX_STEPS, Number(totalSteps) || 20));
            const rows = [];
            let from = 1;
            const source = Array.isArray(timeline) && timeline.length ? timeline : [[steps, '']];

            source.forEach((item) => {
                const to = clampStep(Array.isArray(item) ? item[0] : steps, steps);
                const text = String(Array.isArray(item) ? (item[1] ?? '') : '');
                if (to < from) return;
                rows.push({ from, to, text });
                from = to + 1;
            });

            if (!rows.length) rows.push({ from: 1, to: steps, text: '' });
            if (rows[rows.length - 1].to < steps) {
                rows.push({
                    from: rows[rows.length - 1].to + 1,
                    to: steps,
                    text: rows[rows.length - 1].text
                });
            }
            return rows;
        };

        // --- CUBIC BEZIER INPUTS ---
        const CubicBezierInputs = ({ params, onChange }) => {
            const p = params && typeof params.p1x === 'number' ? params : { p1x: 0.42, p1y: 0, p2x: 0.58, p2y: 1 };
            const set = (k, v) => onChange({ ...p, [k]: Math.max(0, Math.min(1, Number(v) || 0)) });
            return (
                <div className="flex gap-1 mt-1">
                    {[{ k: 'p1x', l: 'P1x' }, { k: 'p1y', l: 'P1y' }, { k: 'p2x', l: 'P2x' }, { k: 'p2y', l: 'P2y' }].map(({ k, l }) => (
                        <div key={k} className="flex-1">
                            <label className="text-[8px] uppercase text-slate-500 block">{l}</label>
                            <input type="number" step="0.01" min="0" max="1"
                                className="w-full bg-slate-900/50 p-1 rounded border border-slate-700 text-[10px] font-mono text-fuchsia-300 focus:border-fuchsia-500 outline-none"
                                value={p[k]}
                                onChange={(e) => set(k, e.target.value)}
                            />
                        </div>
                    ))}
                </div>
            );
        };

        const RangeInput = ({ value, onChange, lang, steps }) => {
            const parsed = String(value || '').trim();
            const [expanded, setExpanded] = React.useState(false);
            const totalSteps = steps || 20;
            const quickPresets = [
                '1-5', '5-10', '10-15', '15-20',
                '1%-25%', '25%-50%', '50%-75%', '75%-100%'
            ];
            const [fromVal, setFromVal] = React.useState('');
            const [toVal, setToVal] = React.useState('');
            const [usePct, setUsePct] = React.useState(false);
            const addCustom = () => {
                if (!fromVal || !toVal) return;
                const r = `${usePct ? fromVal + '%' : fromVal}-${usePct ? toVal + '%' : toVal}`;
                onChange(r);
                setFromVal(''); setToVal(''); setUsePct(false);
                setExpanded(false);
            };
            return (
                <div>
                    <div className="flex gap-1">
                        <input type="text"
                            className="flex-1 bg-slate-900/50 p-1 rounded border border-slate-700 text-[10px] font-mono text-emerald-300 focus:border-emerald-500 outline-none"
                            placeholder="5-15"
                            value={parsed}
                            onChange={e => onChange(e.target.value)}
                        />
                        <button onClick={() => setExpanded(!expanded)}
                            className="text-[9px] px-1.5 rounded border border-slate-700 text-slate-400 hover:text-white">
                            {expanded ? '▲' : '▾'}
                        </button>
                    </div>
                    <div className="flex flex-wrap gap-1 mt-1">
                        {quickPresets.map(p => (
                            <button key={p} onClick={() => onChange(p)}
                                className={`text-[9px] px-1.5 py-0.5 rounded border ${parsed === p ? 'border-emerald-600 bg-emerald-900/30 text-emerald-300' : 'border-slate-700 text-slate-500 hover:text-slate-200'}`}>
                                {p}
                            </button>
                        ))}
                    </div>
                    {expanded && (
                        <div className="flex gap-1 mt-1 items-end">
                            <input type="text" placeholder={lang === 'ru' ? 'От' : 'From'}
                                className="w-12 bg-slate-900/50 p-1 rounded border border-slate-700 text-[10px] font-mono outline-none focus:border-blue-500"
                                value={fromVal} onChange={e => setFromVal(e.target.value)} />
                            <span className="text-[10px] text-slate-500 pb-1">–</span>
                            <input type="text" placeholder={lang === 'ru' ? 'До' : 'To'}
                                className="w-12 bg-slate-900/50 p-1 rounded border border-slate-700 text-[10px] font-mono outline-none focus:border-blue-500"
                                value={toVal} onChange={e => setToVal(e.target.value)} />
                            <label className="flex items-center gap-1 text-[9px] text-slate-400 cursor-pointer pb-1">
                                <input type="checkbox" checked={usePct} onChange={e => setUsePct(e.target.checked)} className="accent-blue-500" />
                                %
                            </label>
                            <button onClick={addCustom}
                                className="text-[9px] px-1.5 py-0.5 rounded border border-blue-700/50 text-blue-300 hover:text-white">
                                {lang === 'ru' ? 'Доб' : 'Add'}
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // --- BLOCKS ---

        // 1. TEXT / WEIGHT BLOCK
        const TextBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].text;
            const tc = TRANSLATIONS[lang].common;
            const weightMode = c.weightMode || 'w';
            return (
                <div className="flex gap-3 items-start animate-in fade-in duration-300">
                    <div className="flex-1">
                        <AutoTextarea 
                            className="w-full bg-slate-900/50 p-3 rounded-lg border border-slate-700 text-sm focus:border-blue-500 outline-none font-sans text-blue-100 placeholder-slate-600 focus:bg-slate-900 min-h-[50px]"
                            placeholder={t.placeholder}
                            value={c.text}
                            onChange={e => onChange({...c, text: e.target.value})}
                            minHeight="50px"
                        />
                    </div>
                    <div className="w-44 shrink-0 flex flex-col gap-2">
                        <div className="flex bg-slate-900 rounded-lg p-1 border border-slate-700">
                            {['(', 'raw', '['].map(mode => (
                                <button 
                                    key={mode}
                                    onClick={() => onChange({...c, wrapper: mode})}
                                    className={`flex-1 py-1 text-[10px] rounded uppercase font-bold transition-all ${c.wrapper === mode ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-500 hover:text-white'}`}
                                >
                                    {mode === '(' ? '( )' : mode === '[' ? '[ ]' : 'Raw'}
                                </button>
                            ))}
                        </div>
                        <div className="flex bg-slate-900 rounded-lg p-1 border border-slate-700">
                            <button
                                onClick={() => onChange({...c, weightMode: 'w', weight: 1.0, deltaWeight: 0})}
                                className={`flex-1 py-1 text-[10px] rounded uppercase font-bold transition-all ${weightMode === 'w' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-500 hover:text-white'}`}
                                title="Standard weight (multiply)"
                            >W</button>
                            <button
                                onClick={() => onChange({...c, weightMode: 'x', weight: 2.0, deltaWeight: 0})}
                                className={`flex-1 py-1 text-[10px] rounded uppercase font-bold transition-all ${weightMode === 'x' ? 'bg-purple-600 text-white shadow-lg' : 'text-slate-500 hover:text-white'}`}
                                title="Token repetition (xN) — clones token in cross-attention"
                            >×Rep</button>
                            <button
                                onClick={() => onChange({...c, weightMode: 'delta', deltaWeight: 0.2, weight: 1.0})}
                                className={`flex-1 py-1 text-[10px] rounded uppercase font-bold transition-all ${weightMode === 'delta' ? 'bg-amber-600 text-white shadow-lg' : 'text-slate-500 hover:text-white'}`}
                                title="Delta weight — adjusts weight incrementally (word +0.2)"
                            >+Δ</button>
                        </div>
                        {c.wrapper !== '[' && weightMode === 'w' && (
                            <div className="bg-slate-900/30 p-2 rounded-lg border border-slate-700/50">
                                <div className="flex justify-between text-[10px] mb-1 text-slate-400 uppercase font-bold">
                                    <span>{tc.weight}</span>
                                    <span className={`font-mono ${c.weight > 1 ? 'text-green-400' : c.weight < 1 ? 'text-red-400' : 'text-blue-400'}`}>{c.weight.toFixed(2)}</span>
                                </div>
                                <input 
                                    type="range" min="0.1" max="2.0" step="0.05" 
                                    value={c.weight} 
                                    onChange={e => onChange({...c, weight: parseFloat(e.target.value)})} 
                                    className="w-full"
                                />
                            </div>
                        )}
                        {c.wrapper !== '[' && weightMode === 'x' && (
                            <div className="bg-slate-900/30 p-2 rounded-lg border border-purple-700/50">
                                <div className="flex justify-between text-[10px] mb-1 text-slate-400 uppercase font-bold">
                                    <span className="text-purple-400">Repeat</span>
                                    <span className="font-mono text-purple-400">{c.weight.toFixed(2)}</span>
                                </div>
                                <input 
                                    type="range" min="-5.0" max="5.0" step="0.1" 
                                    value={c.weight} 
                                    onChange={e => onChange({...c, weight: parseFloat(e.target.value)})} 
                                    className="w-full accent-purple-500"
                                />
                                <div className="text-[8px] text-slate-500 mt-1 text-center">
                                    {c.weight > 0
                                        ? `→ ${Math.floor(Math.abs(c.weight))} copy(ies) × tail ${(Math.abs(c.weight) % 1 + (Math.abs(c.weight) >= 1)).toFixed(1)}`
                                        : '← inverted (negative weight)'}
                                </div>
                            </div>
                        )}
                        {weightMode === 'delta' && (
                            <div className="bg-slate-900/30 p-2 rounded-lg border border-amber-700/50">
                                <div className="flex justify-between text-[10px] mb-1 text-slate-400 uppercase font-bold">
                                    <span className="text-amber-400">Δ delta</span>
                                    <span className={`font-mono ${c.deltaWeight > 0 ? 'text-green-400' : 'text-red-400'}`}>{c.deltaWeight > 0 ? '+' : ''}{Number(c.deltaWeight ?? 0).toFixed(2)}</span>
                                </div>
                                <input
                                    type="range" min="-0.5" max="0.5" step="0.01"
                                    value={c.deltaWeight ?? 0}
                                    onChange={e => onChange({...c, deltaWeight: parseFloat(e.target.value)})}
                                    className="w-full accent-amber-500"
                                />
                                <div className="text-[8px] text-slate-500 mt-1 text-center">
                                    {`${c.deltaWeight > 0 ? '+' : ''}${Number(c.deltaWeight ?? 0).toFixed(2)} applied as word +${Number(c.deltaWeight ?? 0).toFixed(2)}`}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 2. HYBRID MIXER BLOCK
        const HybridBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].hybrid;
            const tc = TRANSLATIONS[lang].common;
            const updateItem = (i, field, val) => {
                const n = [...c.items];
                n[i] = { ...n[i], [field]: val };
                onChange({...c, items: n});
            };

            return (
                <div className="flex flex-col gap-3 animate-in fade-in duration-300">
                    <div className="text-xs text-pink-400 font-bold uppercase flex items-center border-b border-pink-900/30 pb-2">
                         <GitMerge size={14} className="mr-2"/> {t.title} <InfoTooltip text={t.tooltip} />
                    </div>
                    
                    <div className="space-y-2">
                        {c.items.map((item, idx) => (
                            <div key={idx} className="flex gap-2 items-start bg-slate-900/30 p-2 rounded-lg border border-slate-800 hover:border-pink-500/30 transition-colors group relative overflow-hidden">
                                <div 
                                    className="absolute bottom-0 left-0 top-0 bg-pink-500/5 pointer-events-none transition-all duration-300"
                                    style={{ width: `${(item.weight / 3.0) * 100}%` }}
                                ></div>

                                <AutoTextarea 
                                    className="flex-1 bg-transparent text-sm text-pink-100 placeholder-pink-900/50 outline-none z-10"
                                    placeholder={t.placeholder}
                                    value={item.text}
                                    onChange={e => updateItem(idx, 'text', e.target.value)}
                                />
                                <div className="w-px self-stretch bg-slate-700/50 mx-1"></div>
                                <div className="w-24 flex flex-col justify-center pt-1 z-10">
                                    <div className="flex justify-between text-[9px] uppercase font-bold text-slate-500 mb-1">
                                        <span>{tc.w_short}</span>
                                        <span className={`${item.weight > 1 ? 'text-pink-400' : item.weight < 1 ? 'text-slate-400' : 'text-blue-400'}`}>{item.weight.toFixed(2)}</span>
                                    </div>
                                    <input 
                                        type="range" min="0.1" max="3.0" step="0.05"
                                        value={item.weight}
                                        onChange={e => updateItem(idx, 'weight', parseFloat(e.target.value))}
                                        className="w-full h-1 accent-pink-500"
                                    />
                                </div>
                                <button onClick={() => onChange({...c, items: c.items.filter((_, i) => i !== idx)})} className="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1 mt-1 z-10">
                                    <X size={14}/>
                                </button>
                            </div>
                        ))}
                    </div>
                    
                    <button onClick={() => onChange({...c, items: [...c.items, {text: '', weight: 1.0}]})} className="w-full py-2 text-xs font-bold text-pink-500 border border-dashed border-pink-900/50 rounded-lg hover:bg-pink-900/10 transition-colors flex justify-center items-center gap-2">
                        <Plus size={14}/> {t.add}
                    </button>
                </div>
            )
        }

        // 3. SCHEDULE BLOCK
        const ScheduleBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].schedule;
            const mode = c.mode || 'postfix';
            const prompts = Array.isArray(c.prompts) && c.prompts.length ? c.prompts : [''];
            const promptBlocks = Array.isArray(c.promptBlocks) ? c.promptBlocks : [];
            const rangesText = String(c.ranges || '');
            const parsedRanges = rangesText.split(',').map(x => x.trim()).filter(Boolean);

            const getBlocksFor = (idx) => Array.isArray(promptBlocks[idx]) ? promptBlocks[idx] : undefined;
            const updatePrompt = (i, v) => {
                const n = [...prompts];
                n[i] = v;
                onChange({ ...c, prompts: n });
            };
            const setPromptBlocks = (blocks) => onChange({ ...c, promptBlocks: blocks });
            const toggleSlotMode = (idx) => {
                const n = [...(Array.isArray(c.promptBlocks) ? c.promptBlocks : [])];
                while (n.length <= idx) n.push(undefined);
                if (n[idx] !== undefined) {
                    // block → text: drop blocks, keep prompts text
                    n[idx] = undefined;
                } else {
                    // text → block: init empty blocks
                    n[idx] = [];
                }
                // normalize: if all undefined, drop promptBlocks
                const allUndef = n.every(x => x === undefined);
                onChange({ ...c, promptBlocks: allUndef ? undefined : n });
            };
            const addSlot = () => {
                const isBlock = promptBlocks.some(x => x !== undefined);
                if (isBlock) {
                    const n = [...(Array.isArray(c.promptBlocks) ? c.promptBlocks : [])];
                    n.push([]);
                    onChange({ ...c, promptBlocks: n, prompts: [...prompts, ''] });
                } else {
                    onChange({ ...c, prompts: [...prompts, ''] });
                }
            };
            const removeSlot = (idx) => {
                const newPrompts = prompts.filter((_, i) => i !== idx);
                const isBlock = promptBlocks.some(x => x !== undefined);
                if (isBlock) {
                    const n = promptBlocks.filter((_, i) => i !== idx);
                    onChange({ ...c, prompts: newPrompts.length ? newPrompts : [''], promptBlocks: n.length && n.some(x => x !== undefined) ? n : undefined });
                } else {
                    onChange({ ...c, prompts: newPrompts.length ? newPrompts : [''] });
                }
            };
            const setMode = (nextMode) => onChange({ ...c, mode: nextMode });
            const setRanges = (nextRanges) => onChange({ ...c, ranges: nextRanges });
            const addRangeToken = (token) => {
                const clean = String(token || '').trim();
                if (!clean) return;
                const next = parsedRanges.length ? `${parsedRanges.join(', ')}, ${clean}` : clean;
                setRanges(next);
            };
            const removeRangeAt = (idx) => {
                const next = parsedRanges.filter((_, i) => i !== idx);
                setRanges(next.join(', '));
            };
            const addCustomRange = () => {
                const a = String(c.rangeFrom || '').trim();
                const b = String(c.rangeTo || '').trim();
                if (!a || !b) return;
                const usePct = !!c.rangePct;
                addRangeToken(`${a}${usePct ? '%' : ''}-${b}${usePct ? '%' : ''}`);
                onChange({ ...c, rangeFrom: '', rangeTo: '', rangePct: usePct });
            };
            const quickRanges = (() => {
                const q = ['1%-25%', '25%-50%', '50%-75%', '75%-100%'];
                const n = Number(c.limit);
                if (Number.isFinite(n) && n > 1) {
                    const total = Math.max(4, Math.round(n));
                    const b1 = Math.max(1, Math.round(total * 0.25));
                    const b2 = Math.max(b1 + 1, Math.round(total * 0.5));
                    const b3 = Math.max(b2 + 1, Math.round(total * 0.75));
                    q.push(`1-${b1}`);
                    q.push(`${b1 + 1}-${b2}`);
                    q.push(`${b2 + 1}-${b3}`);
                    q.push(`${b3 + 1}-${total}`);
                } else {
                    q.push('1-4');
                    q.push('5-8');
                    q.push('9-12');
                    q.push('13-20');
                }
                return q;
            })();
            
            return (
                <div className="flex flex-col gap-3 animate-in fade-in duration-300">
                    <div className="flex justify-between items-center">
                        <div className="text-xs text-yellow-500 font-bold uppercase flex items-center">
                            {t.title} <InfoTooltip text={t.tooltip} />
                        </div>
                    </div>
                    <div className="bg-slate-900/40 p-2 rounded border border-slate-700/40">
                        <label className="text-[10px] uppercase text-slate-500 font-bold block mb-1">{t.mode}</label>
                        <div className="grid grid-cols-2 gap-2">
                            <button
                                type="button"
                                onClick={() => setMode('inner')}
                                className={`text-xs py-1.5 rounded border transition-colors ${mode === 'inner' ? 'bg-yellow-500/20 border-yellow-500/40 text-yellow-300' : 'bg-slate-900/50 border-slate-700 text-slate-400 hover:text-slate-200'}`}
                            >
                                {t.modeInner}
                            </button>
                            <button
                                type="button"
                                onClick={() => setMode('postfix')}
                                className={`text-xs py-1.5 rounded border transition-colors ${mode === 'postfix' ? 'bg-yellow-500/20 border-yellow-500/40 text-yellow-300' : 'bg-slate-900/50 border-slate-700 text-slate-400 hover:text-slate-200'}`}
                            >
                                {t.modePostfix}
                            </button>
                        </div>
                        <div className="text-[10px] text-slate-500 mt-2">
                            {mode === 'inner' ? t.modeInnerHint : t.modePostfixHint}
                        </div>
                    </div>

                    <div className="flex flex-col gap-2 bg-slate-900/30 p-2 rounded border border-slate-800 relative">
                        <div className="absolute left-[19px] top-4 bottom-4 w-0.5 bg-slate-700/50 -z-10"></div>
                        {prompts.map((p, idx) => {
                            const blocks = getBlocksFor(idx);
                            const isBlock = blocks !== undefined;
                            return (
                                <div key={idx} className="flex flex-col gap-1.5">
                                    <div className="flex gap-2 items-center">
                                        <div className="w-6 h-6 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-[10px] font-mono text-slate-400 z-10 shadow-sm shrink-0">
                                            {idx}
                                        </div>
                                        {isBlock ? (
                                            <div className="flex-1 min-w-0">
                                                <MiniWorkspace blocks={blocks} onChange={(newBlocks) => {
                                                    const n = [...(Array.isArray(c.promptBlocks) ? c.promptBlocks : [])];
                                                    n[idx] = newBlocks;
                                                    setPromptBlocks(n);
                                                }} lang={lang} parentType="schedule" />
                                            </div>
                                        ) : (
                                            <input 
                                                type="text" 
                                                className="flex-1 bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm focus:border-yellow-500 outline-none placeholder-slate-700 transition-colors"
                                                placeholder={idx === 0 ? t.startPlaceholder : t.nextPlaceholder}
                                                value={p}
                                                onChange={e => updatePrompt(idx, e.target.value)}
                                            />
                                        )}
                                        <button
                                            type="button"
                                            onClick={() => toggleSlotMode(idx)}
                                            className={`text-[8px] font-bold px-1.5 py-0.5 rounded border shrink-0 transition-colors ${isBlock ? 'bg-yellow-900/20 border-yellow-700/30 text-yellow-400' : 'border-slate-700 text-slate-500 hover:border-slate-500'}`}
                                            title={isBlock ? 'Switch to text' : 'Switch to sub-blocks'}
                                        >
                                            {isBlock ? '← Tx' : '⊕ Sub'}
                                        </button>
                                        <button onClick={() => removeSlot(idx)} className="text-slate-600 hover:text-red-400 p-1"><X size={14}/></button>
                                    </div>
                                </div>
                            );
                        })}
                        <button onClick={addSlot} className="ml-8 text-xs text-yellow-600 hover:text-yellow-400 flex items-center gap-1 transition-colors">
                            <Plus size={12}/> {t.add}
                        </button>
                    </div>

                    <div className="grid grid-cols-2 gap-3 bg-slate-800/30 p-2 rounded border border-slate-700/30">
                        <div>
                            <label className="text-[10px] uppercase text-slate-500 font-bold flex items-center">{t.endStep} <InfoTooltip text={t.endStepTooltip} /></label>
                            <input 
                                type="text" 
                                className="w-full bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm text-yellow-400 focus:border-yellow-500 outline-none font-mono"
                                placeholder={mode === 'inner' ? "e.g. 0.35 or 12" : "e.g. 20 or 0.5"}
                                value={c.limit}
                                onChange={e => onChange({...c, limit: e.target.value})}
                            />
                        </div>
                        <div>
                            <label className="text-[10px] uppercase text-slate-500 font-bold flex items-center">{t.ranges} <InfoTooltip text={t.rangesTooltip} /></label>
                            <input 
                                type="text" 
                                className="w-full bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm focus:border-blue-500 outline-none font-mono"
                                placeholder={mode === 'inner' ? "e.g. 1-4, 6-8 (inside [])" : "e.g. 1-4, 8-10"}
                                value={c.ranges}
                                onChange={e => onChange({...c, ranges: e.target.value})}
                            />
                        </div>
                    </div>

                    <div className="bg-slate-900/35 p-2 rounded border border-slate-700/30">
                        <div className="text-[10px] uppercase text-slate-500 font-bold mb-2">{t.quickRanges}</div>
                        <div className="flex flex-wrap gap-2 mb-2">
                            {quickRanges.map((token, i) => (
                                <button
                                    key={i}
                                    type="button"
                                    onClick={() => addRangeToken(token)}
                                    className="text-[10px] font-mono px-2 py-1 rounded border border-slate-700 text-slate-300 hover:text-white hover:border-blue-500/60 bg-slate-900/50"
                                >
                                    {token}
                                </button>
                            ))}
                        </div>
                        <div className="grid grid-cols-12 gap-2 items-end">
                            <div className="col-span-4">
                                <label className="text-[10px] uppercase text-slate-500 font-bold">{t.from}</label>
                                <input
                                    type="text"
                                    className="w-full bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm outline-none focus:border-blue-500 font-mono"
                                    placeholder="1"
                                    value={c.rangeFrom || ''}
                                    onChange={e => onChange({ ...c, rangeFrom: e.target.value })}
                                />
                            </div>
                            <div className="col-span-4">
                                <label className="text-[10px] uppercase text-slate-500 font-bold">{t.to}</label>
                                <input
                                    type="text"
                                    className="w-full bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm outline-none focus:border-blue-500 font-mono"
                                    placeholder="4"
                                    value={c.rangeTo || ''}
                                    onChange={e => onChange({ ...c, rangeTo: e.target.value })}
                                />
                            </div>
                            <label className="col-span-2 flex items-center gap-1 text-xs text-slate-300 cursor-pointer justify-center">
                                <input
                                    type="checkbox"
                                    checked={!!c.rangePct}
                                    onChange={e => onChange({ ...c, rangePct: e.target.checked })}
                                    className="accent-blue-500"
                                />
                                {t.pct}
                            </label>
                            <button
                                type="button"
                                onClick={addCustomRange}
                                className="col-span-2 text-xs py-1.5 rounded border border-blue-700/50 text-blue-300 hover:text-white hover:bg-blue-600/20"
                            >
                                {t.addRange}
                            </button>
                        </div>
                        {parsedRanges.length > 0 && (
                            <div className="mt-2">
                                <div className="flex flex-wrap gap-2">
                                    {parsedRanges.map((r, i) => (
                                        <button
                                            key={i}
                                            type="button"
                                            onClick={() => removeRangeAt(i)}
                                            className="text-[10px] font-mono px-2 py-1 rounded bg-slate-800 border border-slate-700 text-slate-300 hover:text-red-300 hover:border-red-700/50"
                                            title={lang === 'ru' ? 'Удалить диапазон' : 'Remove range'}
                                        >
                                            {r} ×
                                        </button>
                                    ))}
                                </div>
                                <button
                                    type="button"
                                    onClick={() => setRanges('')}
                                    className="mt-2 text-[10px] text-slate-500 hover:text-slate-300"
                                >
                                    {t.clearRanges}
                                </button>
                            </div>
                        )}
                    </div>
                    <RangeLayers rangesText={c.ranges} totalSteps={(() => {
                                const l = Number(c.limit);
                                return Number.isFinite(l) && l > 1 ? l : 100;
                            })()} stepsLabel={t.stepsLabel} />
                    
                    <label className="flex items-center gap-2 text-xs text-slate-300 cursor-pointer select-none">
                        <input type="checkbox" checked={c.reverse} onChange={e => onChange({...c, reverse: e.target.checked})} className="rounded bg-slate-700 border-slate-600 accent-yellow-500"/>
                        {t.reverse}
                    </label>
                    <label className="flex items-center gap-2 text-xs text-slate-300 cursor-pointer select-none"
                        title={t.emptySlotsHint}>
                        <input type="checkbox" checked={!!c.emptySlots} onChange={e => onChange({...c, emptySlots: e.target.checked})} className="rounded bg-slate-700 border-slate-600 accent-purple-500"/>
                        {t.emptySlots}
                    </label>
                </div>
            );
        };

        // RangeLayers visual: overlays each parsed range against the total step axis.
        const RangeLayers = ({ rangesText, totalSteps, stepsLabel }) => {
            const steps = Math.max(1, Math.min(TIMELINE_MAX_STEPS, Number(totalSteps) || 20));
            const tokens = String(rangesText || '').split(',').map(x => x.trim()).filter(Boolean);
            const layers = [];
            tokens.forEach((tok) => {
                const p = parseRangeTokenForTimeline(tok, steps);
                if (p) layers.push({ start: p.start, end: p.end, label: tok });
            });
            if (!layers.length) return null;
            const total = steps; // track axis length in steps
            const palette = ['bg-blue-500/50', 'bg-emerald-500/50', 'bg-amber-500/50', 'bg-rose-500/50', 'bg-violet-500/50', 'bg-cyan-500/50'];
            return (
                <div className="mt-2">
                    <div className="text-[10px] uppercase text-slate-500 font-bold mb-1">
                        {steps} {String(stepsLabel || 'steps')}
                    </div>
                    <div className="space-y-1">
                        {layers.map((L, i) => {
                            const wStart = ((L.start - 1) / total) * 100;
                            const wWidth = ((L.end - L.start + 1) / total) * 100;
                            return (
                                <div key={i} className="flex items-center gap-1.5">
                                    <div className="text-[9px] font-mono text-slate-500 w-12 shrink-0">{L.label}</div>
                                    <div className="relative h-3 flex-1 rounded bg-slate-900/70 border border-slate-700/50 overflow-hidden">
                                        <div
                                            className={`absolute inset-y-0 rounded-sm ${palette[i % palette.length]}`}
                                            style={{ left: `${wStart}%`, width: `${wWidth}%` }}
                                        />
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // 4. ALTERNATE BLOCK
        const AlternateBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].alternate;
            const optionBlocks = Array.isArray(c.optionBlocks) ? c.optionBlocks : [];
            const toggleOptBlock = (idx) => {
                const n = [...optionBlocks];
                while (n.length <= idx) n.push(undefined);
                n[idx] = n[idx] !== undefined ? undefined : [];
                const allUndef = n.every(x => x === undefined);
                onChange({ ...c, optionBlocks: allUndef ? undefined : n });
            };
            const updateOptBlocks = (idx, blocks) => {
                const n = [...optionBlocks];
                n[idx] = blocks;
                onChange({ ...c, optionBlocks: n });
            };
            const updateOpt = (i, v) => { const n = [...c.options]; n[i] = v; onChange({...c, options: n}); };

            return (
                <div className="flex flex-col gap-3 animate-in fade-in duration-300">
                    <div className="flex justify-between items-center border-b border-slate-700/50 pb-2">
                        <div className="text-xs text-green-500 font-bold uppercase flex items-center">
                            {t.title} <InfoTooltip text={t.tooltip} />
                        </div>
                        <div className="flex gap-3 items-center">
                            <div className="flex items-center gap-1 bg-slate-900 rounded p-1 border border-slate-700">
                                <span className="text-[10px] uppercase text-slate-500 px-1">{t.count}</span>
                                <input 
                                    type="number" min="1" 
                                    className="w-10 bg-transparent text-center text-sm font-bold outline-none text-green-400"
                                    value={c.count} onChange={e => onChange({...c, count: parseInt(e.target.value) || 1})}
                                />
                            </div>
                            <label className="flex items-center gap-1 text-xs cursor-pointer select-none text-green-300 bg-green-500/10 px-2 py-1 rounded border border-green-500/20 hover:bg-green-500/20 transition-colors">
                                <input type="checkbox" checked={c.distinct} onChange={e => onChange({...c, distinct: e.target.checked})} className="accent-green-500"/>
                                {t.distinct}
                            </label>
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                        {c.options.map((o, idx) => {
                            const isBlock = Array.isArray(optionBlocks[idx]);
                            return (
                                <div key={idx} className="flex gap-1 items-start relative group">
                                    {isBlock ? (
                                        <div className="flex-1 min-w-0">
                                            <MiniWorkspace blocks={optionBlocks[idx]} onChange={(blocks) => updateOptBlocks(idx, blocks)} lang={lang} parentType="alternate" />
                                        </div>
                                    ) : (
                                        <input 
                                            type="text" 
                                            className="flex-1 bg-slate-900/50 p-1.5 pr-2 rounded border border-slate-700 text-sm focus:border-green-500 outline-none"
                                            placeholder={`${t.optionPlaceholder} ${idx+1}`}
                                            value={o}
                                            onChange={e => updateOpt(idx, e.target.value)}
                                        />
                                    )}
                                    <button onClick={() => toggleOptBlock(idx)}
                                        className={`text-[9px] font-bold px-1.5 py-0.5 rounded border shrink-0 transition-colors ${isBlock ? 'bg-green-900/20 border-green-700/30 text-green-400' : 'border-slate-700 text-slate-500 hover:border-slate-500'}`}
                                        title={isBlock ? 'Switch to text' : 'Switch to sub-blocks'}
                                    >
                                        {isBlock ? '← Tx' : '⊕ Sub'}
                                    </button>
                                    <button 
                                        onClick={() => {
                                            const newOpts = c.options.filter((_, i) => i !== idx);
                                            const newOptBlocks = optionBlocks.filter((_, i) => i !== idx);
                                            onChange({...c, options: newOpts, optionBlocks: newOptBlocks.some(x => x !== undefined) ? newOptBlocks : undefined});
                                        }}
                                        className="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1"
                                    >
                                        <X size={14}/>
                                    </button>
                                </div>
                            );
                        })}
                        <button onClick={() => onChange({...c, options: [...c.options, '']})} className="bg-slate-900/30 hover:bg-slate-800 border border-dashed border-slate-700 rounded text-slate-400 flex justify-center items-center py-1.5 transition-colors">
                            <Plus size={16}/> {t.add}
                        </button>
                    </div>
                </div>
            );
        };

        // 4.1 ALTERNATE1 BLOCK (a|b|c)
        const Alternate1Block = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].alternate1;
            const options = Array.isArray(c.options) && c.options.length ? c.options : ['', ''];
            const optionBlocks = Array.isArray(c.optionBlocks) ? c.optionBlocks : [];
            const toggleOptBlock = (idx) => {
                const n = [...optionBlocks];
                while (n.length <= idx) n.push(undefined);
                n[idx] = n[idx] !== undefined ? undefined : [];
                const allUndef = n.every(x => x === undefined);
                onChange({ ...c, optionBlocks: allUndef ? undefined : n });
            };
            const updateOptBlocks = (idx, blocks) => {
                const n = [...optionBlocks];
                n[idx] = blocks;
                onChange({ ...c, optionBlocks: n });
            };
            const updateOpt = (i, v) => {
                const n = [...options];
                n[i] = v;
                onChange({ ...c, options: n });
            };
            const serialized = options.map((o, i) => {
                const bs = Array.isArray(optionBlocks[i]) && optionBlocks[i].length > 0
                    ? optionBlocks[i].map(b => serializeBlock({ type: b.type, content: b.content })).join(' ')
                    : '';
                return bs || o || '';
            }).filter(x => x).join('|');

            return (
                <div className="flex flex-col gap-3 animate-in fade-in duration-300">
                    <div className="text-xs text-emerald-400 font-bold uppercase flex items-center border-b border-emerald-900/30 pb-2">
                        {t.title} <InfoTooltip text={t.tooltip} />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                        {options.map((o, idx) => {
                            const isBlock = Array.isArray(optionBlocks[idx]);
                            return (
                                <div key={idx} className="flex gap-1 items-start relative group">
                                    {isBlock ? (
                                        <div className="flex-1 min-w-0">
                                            <MiniWorkspace blocks={optionBlocks[idx]} onChange={(blocks) => updateOptBlocks(idx, blocks)} lang={lang} parentType="alternate1" />
                                        </div>
                                    ) : (
                                        <input
                                            type="text"
                                            className="flex-1 bg-slate-900/50 p-1.5 pr-2 rounded border border-slate-700 text-sm focus:border-emerald-500 outline-none"
                                            placeholder={`${t.optionPlaceholder} ${idx + 1}`}
                                            value={o}
                                            onChange={(e) => updateOpt(idx, e.target.value)}
                                        />
                                    )}
                                    <button onClick={() => toggleOptBlock(idx)}
                                        className={`text-[9px] font-bold px-1.5 py-0.5 rounded border shrink-0 transition-colors ${isBlock ? 'bg-emerald-900/20 border-emerald-700/30 text-emerald-400' : 'border-slate-700 text-slate-500 hover:border-slate-500'}`}
                                        title={isBlock ? 'Switch to text' : 'Switch to sub-blocks'}
                                    >
                                        {isBlock ? '← Tx' : '⊕ Sub'}
                                    </button>
                                    <button
                                        onClick={() => {
                                            const next = options.filter((_, i) => i !== idx);
                                            const nextBlocks = optionBlocks.filter((_, i) => i !== idx);
                                            onChange({ ...c, options: next.length ? next : ['', ''], optionBlocks: nextBlocks.some(x => x !== undefined) ? nextBlocks : undefined });
                                        }}
                                        className="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1"
                                    >
                                        <X size={14} />
                                    </button>
                                </div>
                            );
                        })}
                        <button
                            onClick={() => onChange({ ...c, options: [...options, ''] })}
                            className="bg-slate-900/30 hover:bg-slate-800 border border-dashed border-slate-700 rounded text-slate-400 flex justify-center items-center py-1.5 transition-colors"
                        >
                            <Plus size={16} /> {t.add}
                        </button>
                    </div>
                    <div className="text-[10px] text-slate-500 font-mono">{serialized || 'a|b|c'}</div>
                </div>
            );
        };

        // 4.2 ALTERNATE2 BLOCK (plain|plain)
        const Alternate2Block = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].alternate2;
            const options = Array.isArray(c.options) && c.options.length ? c.options : ['', ''];
            const optionBlocks = Array.isArray(c.optionBlocks) ? c.optionBlocks : [];
            const normalized = normalizeAlternate2Options(options);
            const toggleOptBlock = (idx) => {
                const n = [...optionBlocks];
                while (n.length <= idx) n.push(undefined);
                n[idx] = n[idx] !== undefined ? undefined : [];
                const allUndef = n.every(x => x === undefined);
                onChange({ ...c, optionBlocks: allUndef ? undefined : n });
            };
            const updateOptBlocks = (idx, blocks) => {
                const n = [...optionBlocks];
                n[idx] = blocks;
                onChange({ ...c, optionBlocks: n });
            };
            const updateOpt = (i, v) => {
                const n = [...options];
                n[i] = v;
                onChange({ ...c, options: n });
            };
            const serialized = options.map((o, i) => {
                const bs = Array.isArray(optionBlocks[i]) && optionBlocks[i].length > 0
                    ? optionBlocks[i].map(b => serializeBlock({ type: b.type, content: b.content })).join(' ')
                    : '';
                return bs || o || '';
            }).filter(x => x).join('|');

            return (
                <div className="flex flex-col gap-3 animate-in fade-in duration-300">
                    <div className="text-xs text-cyan-400 font-bold uppercase flex items-center border-b border-cyan-900/30 pb-2">
                        {t.title} <InfoTooltip text={t.tooltip} />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                        {options.map((o, idx) => {
                            const isBlock = Array.isArray(optionBlocks[idx]);
                            return (
                                <div key={idx} className="flex gap-1 items-start relative group">
                                    {isBlock ? (
                                        <div className="flex-1 min-w-0">
                                            <MiniWorkspace blocks={optionBlocks[idx]} onChange={(blocks) => updateOptBlocks(idx, blocks)} lang={lang} parentType="alternate2" />
                                        </div>
                                    ) : (
                                        <input
                                            type="text"
                                            className="flex-1 bg-slate-900/50 p-1.5 pr-2 rounded border border-slate-700 text-sm focus:border-cyan-500 outline-none font-mono"
                                            placeholder={`${t.optionPlaceholder} ${idx + 1}`}
                                            value={o}
                                            onChange={(e) => updateOpt(idx, e.target.value)}
                                        />
                                    )}
                                    <button onClick={() => toggleOptBlock(idx)}
                                        className={`text-[9px] font-bold px-1.5 py-0.5 rounded border shrink-0 transition-colors ${isBlock ? 'bg-cyan-900/20 border-cyan-700/30 text-cyan-400' : 'border-slate-700 text-slate-500 hover:border-slate-500'}`}
                                        title={isBlock ? 'Switch to text' : 'Switch to sub-blocks'}
                                    >
                                        {isBlock ? '← Tx' : '⊕ Sub'}
                                    </button>
                                    <button
                                        onClick={() => {
                                            const next = options.filter((_, i) => i !== idx);
                                            const nextBlocks = optionBlocks.filter((_, i) => i !== idx);
                                            onChange({ ...c, options: next.length ? next : ['', ''], optionBlocks: nextBlocks.some(x => x !== undefined) ? nextBlocks : undefined });
                                        }}
                                        className="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1"
                                    >
                                        <X size={14} />
                                    </button>
                                </div>
                            );
                        })}
                        <button
                            onClick={() => onChange({ ...c, options: [...options, ''] })}
                            className="bg-slate-900/30 hover:bg-slate-800 border border-dashed border-slate-700 rounded text-slate-400 flex justify-center items-center py-1.5 transition-colors"
                        >
                            <Plus size={16} /> {t.add}
                        </button>
                    </div>
                    <div className="bg-slate-900/35 border border-slate-700/40 rounded p-2">
                        <div className="flex items-center justify-between gap-3">
                            <div className="text-[10px] uppercase tracking-wide text-slate-500 font-bold">{t.normalized}</div>
                            <button
                                type="button"
                                onClick={() => onChange({ ...c, options: normalized })}
                                className="text-[10px] px-2 py-1 rounded border border-cyan-800/50 text-cyan-300 hover:text-white hover:bg-cyan-600/20"
                            >
                                {t.normalize}
                            </button>
                        </div>
                        <div className="mt-1 text-[10px] text-slate-500">{t.suffixHint}</div>
                        <div className="mt-1 text-[11px] font-mono text-cyan-300 break-all">{serialized || 'red_hair|blue'}</div>
                    </div>
                </div>
            );
        };

    const InterpBlock = ({ c, onChange, lang }) => {
        const t = TRANSLATIONS[lang].interp;
        const weights = Array.isArray(c.weights) && c.weights.length >= 2 ? c.weights : [1.0, 2.0];
        const updateWeight = (index, value) => {
            const next = [...weights];
            if (/^-?(\.|\d+\.?\d*)$/.test(value) || value === '' || value === '-') {
                next[index] = value;
            } else {
                const n = Number(value);
                next[index] = Number.isFinite(n) ? n : (next[index] || 0);
            }
            onChange({ ...c, weights: next });
        };
        const handleWeightKey = (index, e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'PageUp' || e.key === 'PageDown') {
                e.preventDefault();
                const cur = Number(weights[index]) || 0;
                let delta = 0;
                if (e.key === 'ArrowUp') delta = e.shiftKey ? 0.5 : 0.05;
                else if (e.key === 'ArrowDown') delta = e.shiftKey ? -0.5 : -0.05;
                else if (e.key === 'PageUp') delta = 1.0;
                else if (e.key === 'PageDown') delta = -1.0;
                const next = [...weights];
                next[index] = Math.round((cur + delta) * 1000) / 1000;
                onChange({ ...c, weights: next });
            }
        };
        const addWeight = () => {
            const last = weights.length > 0 ? weights[weights.length - 1] : 1.0;
            onChange({ ...c, weights: [...weights, last + 1.0] });
        };
        const [weightText, setWeightText] = useState(weights.join('->'));
        const parseWeightText = (text) => {
            const parsed = text.split('->').map(s => {
                const n = Number(s.trim());
                return Number.isFinite(n) ? n : null;
            }).filter(n => n !== null);
            if (parsed.length >= 2) {
                onChange({ ...c, weights: parsed });
            }
        };
        useEffect(() => {
            setWeightText(weights.join('->'));
        }, [weights.join(',')]);
        const allModes = t.modes;
        const endStep = String(c.endStep || '').trim();
        const startStep = String(c.startStep || '').trim();
        const useBodyBlocks = Array.isArray(c.bodyBlocks);
        return (
            <div className="flex flex-col gap-3 animate-in fade-in duration-300">
                <div className="text-xs text-fuchsia-400 font-bold uppercase flex items-center border-b border-fuchsia-900/30 pb-2">
                    {t.title} <InfoTooltip text={t.tooltip} />
                </div>
                <div>
                    <div className="flex items-center justify-between mb-1">
                        <label className="text-[10px] uppercase text-slate-500 font-bold block">{t.body}</label>
                        <button
                            type="button"
                            onClick={() => onChange({ ...c, bodyBlocks: useBodyBlocks ? undefined : (c.bodyBlocks || []) })}
                            className={`text-[9px] font-bold px-2 py-0.5 rounded border transition-colors ${useBodyBlocks ? 'bg-fuchsia-900/20 border-fuchsia-700/30 text-fuchsia-400' : 'border-slate-700 text-slate-500 hover:border-slate-500'}`}
                        >
                            {useBodyBlocks ? '← Text' : '⊕ Sub'}
                        </button>
                    </div>
                    {useBodyBlocks ? (
                        <MiniWorkspace blocks={c.bodyBlocks} onChange={(blocks) => onChange({ ...c, bodyBlocks: blocks })} lang={lang} parentType="interp" />
                    ) : (
                        <AutoTextarea
                            className="w-full bg-slate-900/50 p-2 rounded border border-slate-700 text-sm focus:border-fuchsia-500 outline-none"
                            placeholder={t.bodyPlaceholder}
                            value={c.body || ''}
                            onChange={(e) => onChange({ ...c, body: e.target.value })}
                        />
                    )}
                </div>
                <div className="flex gap-3 items-start">
                    <div className="flex-1 space-y-1">
                        <label className="text-[10px] uppercase text-slate-500 font-bold block mb-1">
                            {t.weights} <InfoTooltip text={t.multiWeightHint} />
                        </label>
                        <div className="flex flex-wrap gap-1">
                            {weights.map((w, idx) => (
                                <div key={idx} className="flex items-center gap-1">
                                    <input
                                        type="text"
                                        className="w-20 bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm font-mono text-fuchsia-300 focus:border-fuchsia-500 outline-none"
                                        value={w}
                                        onChange={(e) => updateWeight(idx, e.target.value)}
                                        onKeyDown={(e) => handleWeightKey(idx, e)}
                                    />
                                    {idx < weights.length - 1 && (
                                        <span className="text-slate-600 text-xs font-bold">→</span>
                                    )}
                                </div>
                            ))}
                            <button
                                type="button"
                                onClick={addWeight}
                                className="p-1.5 text-slate-500 hover:text-fuchsia-400 border border-dashed border-slate-700 rounded transition-colors"
                                title={t.addWeight}
                            >
                                <Plus size={14} />
                            </button>
                            {weights.length > 2 && (
                                <button
                                    type="button"
                                    onClick={() => onChange({ ...c, weights: weights.slice(0, -1) })}
                                    className="p-1.5 text-slate-500 hover:text-red-400 border border-dashed border-slate-700 rounded transition-colors"
                                    title="Remove last weight"
                                >
                                    <X size={14} />
                                </button>
                            )}
                        </div>
                        <input
                            type="text"
                            className="w-full bg-slate-950/40 p-1.5 rounded border border-slate-700 text-xs font-mono text-fuchsia-300 focus:border-fuchsia-500 outline-none mt-1"
                            placeholder={'1.0->2.0->3.0'}
                            value={weightText}
