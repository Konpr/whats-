            if (type === 'blend') content = { prefix: '', suffix: '', intensity: 1.0, channelTarget: 'both', mode: 'mean', branches: [{ text: '', weight: 1.0 }, { text: '', weight: 1.0 }] };
            if (type === 'morph') content = { prefix: '', suffix: '', intensity: 1.0, channelTarget: 'both', mode: 'points', windowStart: '', windowEnd: '', curve: 'linear', points: [{ text: '', boundary: '', weight: '' }, { text: '', boundary: '', weight: '' }] };
            if (type === 'cfg_schedule') content = { weights: [7.0, 3.0], boundary: '' };
            if (type === 'usevar') content = { varType: 'var', name: '' };
            return { id, type, content, collapsed: false };
        };

        const MiniWorkspace = ({ blocks, onChange, lang, parentType }) => {
            const updateBlock = (id, newContent) => {
                onChange(blocks.map(b => b.id === id ? { ...b, content: newContent } : b));
            };
            const removeBlock = (id) => {
                onChange(blocks.filter(b => b.id !== id));
            };
            const moveBlock = (idx, dir) => {
                const next = [...blocks];
                const to = idx + dir;
                if (to < 0 || to >= next.length) return;
                [next[idx], next[to]] = [next[to], next[idx]];
                onChange(next);
            };
            const toggleCollapse = (id) => {
                onChange(blocks.map(b => b.id === id ? { ...b, collapsed: !b.collapsed } : b));
            };

            const blockedTypes = parentType ? [parentType] : [];
            const availableTypes = SUB_BLOCK_TYPES.filter(t => !blockedTypes.includes(t));

            const subBtn = (type) => {
                const color = SUB_COLORS[type] || 'slate';
                const colorMap = {
                    blue: 'border-blue-500/20 text-blue-300 hover:bg-blue-500/10',
                    cyan: 'border-cyan-500/20 text-cyan-300 hover:bg-cyan-500/10',
                    amber: 'border-amber-500/20 text-amber-300 hover:bg-amber-500/10',
                    violet: 'border-violet-500/20 text-violet-300 hover:bg-violet-500/10',
                    emerald: 'border-emerald-500/20 text-emerald-300 hover:bg-emerald-500/10',
                    rose: 'border-rose-500/20 text-rose-300 hover:bg-rose-500/10',
                    pink: 'border-pink-500/20 text-pink-300 hover:bg-pink-500/10',
                    sky: 'border-sky-500/20 text-sky-300 hover:bg-sky-500/10',
                    yellow: 'border-yellow-500/20 text-yellow-300 hover:bg-yellow-500/10',
                    fuchsia: 'border-fuchsia-500/20 text-fuchsia-300 hover:bg-fuchsia-500/10',
                };
                return (
                    <button
                        onClick={() => onChange([...blocks, createDefaultSubBlock(type)])}
                        className={`px-2 py-0.5 rounded border text-[9px] font-bold uppercase tracking-wider ${colorMap[color]} transition-colors`}
                    >
                        +{type}
                    </button>
                );
            };

            const renderSubBlockContent = (block) => {
                const c = block.content || {};
                const sharedProps = { lang };
                if (block.type === 'text') {
                    return (
                        <div className="flex gap-2 items-start">
                            <input
                                className="flex-1 bg-slate-900/60 p-1.5 rounded border border-slate-700 text-xs focus:border-blue-500 outline-none"
                                placeholder="Text..."
                                value={c.text || ''}
                                onChange={(e) => updateBlock(block.id, { ...c, text: e.target.value })}
                            />
                            <div className="w-16 flex-shrink-0">
                                <label className="text-[8px] uppercase text-slate-600 block mb-0.5">W</label>
                                <input
                                    type="number" step="0.05" min="0.01"
                                    className="w-full bg-slate-900/60 p-1 rounded border border-slate-700 text-[10px] font-mono focus:border-blue-500 outline-none"
                                    value={c.weight ?? 1}
                                    onChange={(e) => updateBlock(block.id, { ...c, weight: e.target.value })}
                                />
                            </div>
                        </div>
                    );
                }
                if (block.type === 'blend') return <BlendBlock c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                if (block.type === 'chunk') return <ChunkBlock c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                if (block.type === 'morph') return <MorphBlock c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                if (block.type === 'pool') return <PoolBlock c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                if (block.type === 'bind') return <BindBlock c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                if (block.type === 'bind2') return <Bind2Block c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                if (block.type === 'bind3') return <Bind3Block c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                if (block.type === 'diff') return <DiffBlock c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
            if (block.type === 'compound') return <CompoundBlock c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                if (block.type === 'assemble') return <AssembleBlock c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                if (block.type === 'schedule') return <ScheduleBlock c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                if (block.type === 'interp') return <InterpBlock c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                if (block.type === 'cfg_schedule') return <CFGScheduleBlock c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                if (block.type === 'usevar') return <UseVarBlock c={c} onChange={(nc) => updateBlock(block.id, nc)} {...sharedProps} />;
                return <div className="text-[10px] text-slate-500">Unknown: {block.type}</div>;
            };

            return (
                <div className="bg-slate-950/30 border border-slate-800 rounded overflow-hidden">
                    <div className="flex flex-wrap gap-1 p-1.5 bg-slate-900/30 border-b border-slate-800">
                        {availableTypes.map(type => subBtn(type))}
                    </div>
                    {blocks.map((block, idx) => (
                        <div key={block.id} className="border-b border-slate-800 last:border-0">
                            <div className="flex items-center justify-between px-2 py-1 bg-slate-900/20 select-none" onClick={() => toggleCollapse(block.id)}>
                                <div className="flex items-center gap-2">
                                    <span className="text-[9px] font-bold uppercase text-slate-500">{block.type}</span>
                                    {block.collapsed && (
                                        <span className="text-[10px] text-slate-600 truncate max-w-[120px]">
                                            {serializeBlock(block) || '...'}
                                        </span>
                                    )}
                                </div>
                                <div className="flex items-center gap-0.5" onClick={(e) => e.stopPropagation()}>
                                    <button onClick={() => moveBlock(idx, -1)} disabled={idx === 0} className="p-0.5 hover:bg-slate-700 rounded text-slate-500 hover:text-white disabled:opacity-20"><MoveUp size={10}/></button>
                                    <button onClick={() => moveBlock(idx, 1)} disabled={idx === blocks.length - 1} className="p-0.5 hover:bg-slate-700 rounded text-slate-500 hover:text-white disabled:opacity-20"><MoveDown size={10}/></button>
                                    <button onClick={() => removeBlock(block.id)} className="p-0.5 hover:bg-red-900/30 rounded text-slate-500 hover:text-red-400"><X size={10}/></button>
                                </div>
                            </div>
                            {!block.collapsed && (
                                <div className="p-2">
                                    {renderSubBlockContent(block)}
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        };

        // 5. SEQUENCE BLOCK (IMPROVED with explanation)
        const SequenceBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].sequence;
            const currentTypeInfo = t.types[c.type] || t.types.std;
            const innerBlocks = Array.isArray(c.innerBlocks) ? c.innerBlocks : [];
            const outerBlocks = Array.isArray(c.outerBlocks) ? c.outerBlocks : [];
            const toggleInnerBlock = (idx) => {
                const n = [...innerBlocks];
                while (n.length <= idx) n.push(undefined);
                n[idx] = n[idx] !== undefined ? undefined : [];
                const allUndef = n.every(x => x === undefined);
                onChange({ ...c, innerBlocks: allUndef ? undefined : n });
            };
            const toggleOuterBlock = (idx) => {
                const n = [...outerBlocks];
                while (n.length <= idx) n.push(undefined);
                n[idx] = n[idx] !== undefined ? undefined : [];
                const allUndef = n.every(x => x === undefined);
                onChange({ ...c, outerBlocks: allUndef ? undefined : n });
            };
            const updateInnerBlocks = (idx, blocks) => {
                const n = [...innerBlocks];
                n[idx] = blocks;
                onChange({ ...c, innerBlocks: n });
            };
            const updateOuterBlocks = (idx, blocks) => {
                const n = [...outerBlocks];
                n[idx] = blocks;
                onChange({ ...c, outerBlocks: n });
            };

            return (
                <div className="flex flex-col gap-3 animate-in fade-in duration-300">
                    <div className="flex justify-between items-center border-b border-indigo-900/30 pb-1">
                        <div className="text-xs text-indigo-400 font-bold uppercase flex items-center">
                            {t.title} <InfoTooltip text={t.tooltip} />
                        </div>
                        <div className="flex gap-3 items-center">
                            <div className="flex items-center gap-1 bg-slate-900 rounded p-1 border border-slate-700">
                                <span className="text-[10px] uppercase text-slate-500 px-1">{t.count}</span>
                                <input
                                    type="number" min="1"
                                    className="w-10 bg-transparent text-center text-sm font-bold outline-none text-indigo-400"
                                    value={c.count} onChange={e => onChange({...c, count: parseInt(e.target.value) || 1})}
                                />
                            </div>
                            <label className="flex items-center gap-1 text-xs cursor-pointer select-none text-indigo-300 bg-indigo-500/10 px-2 py-1 rounded border border-indigo-500/20 hover:bg-indigo-500/20 transition-colors">
                                <input type="checkbox" checked={c.distinct} onChange={e => onChange({...c, distinct: e.target.checked})} className="accent-indigo-500"/>
                                {t.distinct}
                            </label>
                        </div>
                    </div>
                    
                    {/* NEW: Sequence Type Information Box */}
                    <div className="bg-slate-800/60 p-2 rounded-lg border border-slate-700/50 text-xs flex gap-3 items-start">
                        <div className="mt-1 text-indigo-400"><LayoutTemplate size={16}/></div>
                        <div className="flex-1 grid grid-cols-1 md:grid-cols-2 gap-2">
                            <div>
                                <label className="text-[10px] text-slate-500 font-bold uppercase block mb-1">{t.type}</label>
                                <select 
                                    className="w-full bg-slate-900 p-1.5 rounded border border-slate-700 text-sm text-indigo-300 outline-none focus:border-indigo-500 transition-colors"
                                    value={c.type} onChange={e => onChange({...c, type: e.target.value})}
                                >
                                    <option value="std">{t.types.std.label}</option>
                                    <option value="top">{t.types.top.label}</option>
                                    <option value="deep">{t.types.deep.label}</option>
                                </select>
                            </div>
                            <div className="flex flex-col justify-center border-l border-slate-700 pl-2">
                                <p className="text-slate-300 font-medium leading-tight">{currentTypeInfo.desc}</p>
                                <div className="mt-1 bg-black/30 p-1 rounded font-mono text-[10px] text-slate-400 truncate">
                                    {currentTypeInfo.format}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="flex gap-2">
                        <div className="flex-1">
                            <div className="flex items-center justify-between mb-1 ml-1">
                                <label className="text-[10px] text-indigo-300/70 font-bold uppercase">{t.subject}</label>
                                <button
                                    type="button"
                                    onClick={() => onChange({ ...c, ownerBlocks: Array.isArray(c.ownerBlocks) ? undefined : (c.ownerBlocks || []) })}
                                    className={`text-[8px] font-bold px-1.5 py-0.5 rounded border transition-colors ${Array.isArray(c.ownerBlocks) ? 'bg-indigo-900/20 border-indigo-700/30 text-indigo-400' : 'border-slate-700 text-slate-500 hover:border-slate-500'}`}
                                >
                                    {Array.isArray(c.ownerBlocks) ? '← Tx' : '⊕ Sub'}
                                </button>
                            </div>
                            {Array.isArray(c.ownerBlocks) ? (
                                <MiniWorkspace blocks={c.ownerBlocks} onChange={(blocks) => onChange({ ...c, ownerBlocks: blocks })} lang={lang} parentType="sequence" />
                            ) : (
                                <input 
                                    type="text" 
                                    className="w-full bg-slate-900/50 p-2 rounded border border-indigo-900 text-sm font-bold text-indigo-300 focus:border-indigo-500 outline-none"
                                    placeholder="e.g. 1girl"
                                    value={c.owner} onChange={e => onChange({...c, owner: e.target.value})}
                                />
                            )}
                        </div>
                    </div>

                    <div className="pl-3 border-l-2 border-indigo-500/50 flex flex-col gap-2">
                        <div className="text-[10px] uppercase text-indigo-400 font-bold flex justify-between">
                            <span>{c.type === 'deep' ? t.inner : t.props}</span>
                            {c.type === 'std' && (
                                <label className="flex items-center gap-1 cursor-pointer">
                                    <input type="checkbox" checked={c.random} onChange={e => onChange({...c, random: e.target.checked})}/>
                                    {t.random}
                                </label>
                            )}
                        </div>
                        {c.inner.map((item, idx) => {
                            const isBlock = Array.isArray(innerBlocks[idx]);
                            return (
                                <div key={idx} className="flex flex-col gap-1 group">
                                    <div className="flex gap-1 items-start">
                                        {isBlock ? (
                                            <div className="flex-1 min-w-0">
                                                <MiniWorkspace blocks={innerBlocks[idx]} onChange={(blocks) => updateInnerBlocks(idx, blocks)} lang={lang} parentType="sequence" />
                                            </div>
                                        ) : (
                                            <AutoTextarea 
                                                className="flex-1 bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm focus:border-indigo-500 outline-none"
                                                value={item} 
                                                placeholder={t.propPlaceholder}
                                                onChange={e => {const n = [...c.inner]; n[idx]=e.target.value; onChange({...c, inner: n})}}
                                            />
                                        )}
                                        <button onClick={() => toggleInnerBlock(idx)}
                                            className={`text-[9px] font-bold px-2 py-1 rounded border shrink-0 transition-colors ${isBlock ? 'bg-indigo-900/20 border-indigo-700/30 text-indigo-400' : 'border-slate-700 text-slate-500 hover:border-slate-500'}`}
                                            title={isBlock ? 'Switch to text' : 'Switch to sub-blocks'}
                                        >
                                            {isBlock ? '← Tx' : '⊕ Sub'}
                                        </button>
                                        <button onClick={() => {
                                            const newInner = c.inner.filter((_, i) => i !== idx);
                                            const newInnerBlocks = innerBlocks.filter((_, i) => i !== idx);
                                            onChange({...c, inner: newInner, innerBlocks: newInnerBlocks.some(x => x !== undefined) ? newInnerBlocks : undefined});
                                        }} className="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100"><X size={14}/></button>
                                    </div>
                                </div>
                            );
                        })}
                        <button onClick={() => onChange({...c, inner: [...c.inner, '']})} className="text-xs text-indigo-400 flex items-center gap-1 hover:text-indigo-300"><Plus size={12}/> {t.addProp}</button>
                    </div>

                    {(c.type === 'deep' || c.type === 'top') && (
                        <div className="pl-3 border-l-2 border-pink-500/50 flex flex-col gap-2 mt-1 bg-pink-900/10 p-2 rounded-r">
                            <div className="text-[10px] uppercase text-pink-400 font-bold flex items-center">
                                {c.type === 'deep' ? t.outer : t.trailing}
                                <InfoTooltip text={t.outerTooltip} />
                            </div>
                            {c.outer.map((item, idx) => {
                                const isBlock = Array.isArray(outerBlocks[idx]);
                                return (
                                    <div key={idx} className="flex flex-col gap-1 group">
                                        <div className="flex gap-1 items-start">
                                            {isBlock ? (
                                                <div className="flex-1 min-w-0">
                                                    <MiniWorkspace blocks={outerBlocks[idx]} onChange={(blocks) => updateOuterBlocks(idx, blocks)} lang={lang} parentType="sequence" />
                                                </div>
                                            ) : (
                                                <AutoTextarea 
                                                    className="flex-1 bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm focus:border-pink-500 outline-none"
                                                    value={item} 
                                                    placeholder={t.outerPlaceholder}
                                                    onChange={e => {const n = [...c.outer]; n[idx]=e.target.value; onChange({...c, outer: n})}}
                                                />
                                            )}
                                            <button onClick={() => toggleOuterBlock(idx)}
                                                className={`text-[9px] font-bold px-2 py-1 rounded border shrink-0 transition-colors ${isBlock ? 'bg-pink-900/20 border-pink-700/30 text-pink-400' : 'border-slate-700 text-slate-500 hover:border-slate-500'}`}
                                                title={isBlock ? 'Switch to text' : 'Switch to sub-blocks'}
                                            >
                                                {isBlock ? '← Tx' : '⊕ Sub'}
                                            </button>
                                            <button onClick={() => {
                                                const newOuter = c.outer.filter((_, i) => i !== idx);
                                                const newOuterBlocks = outerBlocks.filter((_, i) => i !== idx);
                                                onChange({...c, outer: newOuter, outerBlocks: newOuterBlocks.some(x => x !== undefined) ? newOuterBlocks : undefined});
                                            }} className="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100"><X size={14}/></button>
                                        </div>
                                    </div>
                                );
                            })}
                            <button onClick={() => onChange({...c, outer: [...c.outer, '']})} className="text-xs text-pink-400 flex items-center gap-1 hover:text-pink-300"><Plus size={12}/> {t.addOuter}</button>
                        </div>
                    )}
                </div>
            );
        };

        // 6. GROUP BLOCK
        const GroupBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang].group;
            const itemBlocks = Array.isArray(c.itemBlocks) ? c.itemBlocks : [];
            const toggleItemBlock = (idx) => {
                const n = [...itemBlocks];
                while (n.length <= idx) n.push(undefined);
                n[idx] = n[idx] !== undefined ? undefined : [];
                const allUndef = n.every(x => x === undefined);
                onChange({ ...c, itemBlocks: allUndef ? undefined : n });
            };
            const updateItemBlocks = (idx, blocks) => {
                const n = [...itemBlocks];
                n[idx] = blocks;
                onChange({ ...c, itemBlocks: n });
            };
            return (
                <div className="flex flex-col gap-2 animate-in fade-in duration-300">
                    <div className="flex justify-between items-center border-b border-slate-700/50 pb-1">
                        <div className="text-[10px] text-orange-400 uppercase font-bold flex items-center">
                            {t.title} <InfoTooltip text={t.tooltip} />
                        </div>
                        <div className="flex gap-3 items-center">
                            <div className="flex items-center gap-1 bg-slate-900 rounded p-1 border border-slate-700">
                                <span className="text-[10px] uppercase text-slate-500 px-1">{t.count}</span>
                                <input
                                    type="number" min="1"
                                    className="w-10 bg-transparent text-center text-sm font-bold outline-none text-orange-400"
                                    value={c.count} onChange={e => onChange({...c, count: parseInt(e.target.value) || 1})}
                                />
                            </div>
                            <label className="flex items-center gap-1 text-xs cursor-pointer select-none text-orange-300 bg-orange-500/10 px-2 py-1 rounded border border-orange-500/20 hover:bg-orange-500/20 transition-colors">
                                <input type="checkbox" checked={c.distinct} onChange={e => onChange({...c, distinct: e.target.checked})} className="accent-orange-500"/>
                                {t.distinct}
                            </label>
                        </div>
                    </div>
                    <div className="bg-slate-900/30 p-2 rounded border border-slate-800">
                        {c.items.map((item, idx) => {
                            const isBlock = Array.isArray(itemBlocks[idx]);
                            return (
                                <div key={idx} className="flex flex-col gap-1 mb-2 last:mb-0 group">
                                    <div className="flex gap-2 items-start">
                                        {isBlock ? (
                                            <div className="flex-1 min-w-0">
                                                <MiniWorkspace blocks={itemBlocks[idx]} onChange={(blocks) => updateItemBlocks(idx, blocks)} lang={lang} parentType="group" />
                                            </div>
                                        ) : (
                                            <AutoTextarea 
                                                className="flex-1 bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm focus:border-orange-500 outline-none"
                                                placeholder={t.placeholder}
                                                value={item} onChange={e => {const n = [...c.items]; n[idx]=e.target.value; onChange({...c, items: n})}}
                                            />
                                        )}
                                        <button onClick={() => toggleItemBlock(idx)}
                                            className={`text-[9px] font-bold px-2 py-1 rounded border shrink-0 transition-colors ${isBlock ? 'bg-orange-900/20 border-orange-700/30 text-orange-400' : 'border-slate-700 text-slate-500 hover:border-slate-500'}`}
                                            title={isBlock ? 'Switch to text' : 'Switch to sub-blocks'}
                                        >
                                            {isBlock ? '← Tx' : '⊕ Sub'}
                                        </button>
                                        <button onClick={() => {
                                            const newItems = c.items.filter((_, i) => i !== idx);
                                            const newItemBlocks = itemBlocks.filter((_, i) => i !== idx);
                                            onChange({...c, items: newItems, itemBlocks: newItemBlocks.some(x => x !== undefined) ? newItemBlocks : undefined});
                                        }} className="text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100"><X size={14}/></button>
                                    </div>
                                </div>
                            );
                        })}
                         <button onClick={() => onChange({...c, items: [...c.items, '']})} className="w-full mt-2 py-1 text-xs text-orange-400 border border-dashed border-orange-900/50 rounded hover:bg-orange-900/10 transition-colors">
                            + {t.add}
                        </button>
                    </div>
                </div>
            );
        };

        const ToneGBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang];
            return (
                <div className="flex flex-col gap-2 animate-in fade-in duration-300">
                    <div className="text-[10px] text-rose-400 uppercase font-bold mb-1 flex items-center">
                        {t.toneg?.title || 'TONEG'} <InfoTooltip text={t.toneg?.tooltip || 'Extra negative via TONEG{...}'} />
                    </div>
                    <div className="flex gap-2">
                        <div className="flex-1">
                            <label className="text-[9px] uppercase text-slate-500 block mb-1">{t.toneg?.label || 'Negative text'}</label>
                            <AutoTextarea
                                className="w-full bg-slate-900/50 p-2 rounded border border-slate-700 text-sm focus:border-rose-500 outline-none"
                                placeholder={t.toneg?.placeholder || 'cat, bad quality'}
                                value={c.text || ''}
                                onChange={e => onChange({...c, text: e.target.value})}
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const ParamBlock = ({ c, onChange, lang, blockType }) => {
            const nameKey = blockType === 'param' ? 'param' : blockType === 'setvar' ? 'setvar' : 'setmacro';
            const tlabel = TRANSLATIONS[lang]?.[nameKey] || {};
            const nameLabel = blockType === 'param' ? (tlabel.name || 'Name') : (tlabel.varName || 'Variable name');
            const valLabel = blockType === 'param' ? (tlabel.value || 'Value') : (tlabel.defaultValue || 'Default value');
            const infoText = blockType === 'param' ? (tlabel.tooltip || '<param[name]:value>') : blockType === 'setvar' ? (tlabel.tooltip || '<setvar[name]:value>') : (tlabel.tooltip || '<setmacro[name]:value>');
            const colors = { param: 'cyan', setvar: 'yellow', setmacro: 'orange' };
            const color = colors[blockType] || 'gray';
            const borderCls = { cyan: 'focus:border-cyan-500', yellow: 'focus:border-yellow-500', orange: 'focus:border-orange-500' };
            const nameField = blockType === 'param' ? 'paramName' : 'varName';
            const valueField = blockType === 'param' ? 'paramValue' : 'varValue';
            return (
                <div className="flex flex-col gap-2 animate-in fade-in duration-300">
                    <div className="text-[10px] uppercase font-bold mb-1 flex items-center" style={{color: `var(--tw-${color}-400)`}}>
                        {blockType} <InfoTooltip text={infoText} />
                    </div>
                    <div className="flex gap-2">
                        <div className="flex-1">
                            <label className="text-[9px] uppercase text-slate-500 block mb-1">{nameLabel}</label>
                            <input
                                className={`w-full bg-slate-900/50 p-2 rounded border border-slate-700 text-sm ${borderCls[color]} outline-none`}
                                placeholder={tlabel.placeholderName || 'name'}
                                value={c[nameField] || ''}
                                onChange={e => onChange({...c, [nameField]: e.target.value})}
                            />
                        </div>
                        <div className="flex-1">
                            <label className="text-[9px] uppercase text-slate-500 block mb-1">{valLabel}</label>
                            <input
                                className={`w-full bg-slate-900/50 p-2 rounded border border-slate-700 text-sm ${borderCls[color]} outline-none`}
                                placeholder={tlabel.placeholderValue || 'value'}
                                value={c[valueField] || ''}
                                onChange={e => onChange({...c, [valueField]: e.target.value})}
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const WildcardBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang]?.random_wildcard || {};
            return (
                <div className="flex flex-col gap-2 animate-in fade-in duration-300">
                    <div className="text-[10px] text-emerald-400 uppercase font-bold mb-1 flex items-center">
                        {t.title || 'Random Wildcard'} <InfoTooltip text={t.tooltip || '<random:file>'} />
                    </div>
                    <div>
                        <label className="text-[9px] uppercase text-slate-500 block mb-1">{t.file || 'File'}</label>
                        <input
                            className="w-full bg-slate-900/50 p-2 rounded border border-slate-700 text-sm focus:border-emerald-500 outline-none"
                            placeholder={t.placeholder || 'filename'}
                            value={c.file || ''}
                            onChange={e => onChange({...c, file: e.target.value})}
                        />
                    </div>
                </div>
            );
        };

        const WildcardDoubleBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang]?.wildcard_double || {};
            return (
                <div className="flex flex-col gap-2 animate-in fade-in duration-300">
                    <div className="text-[10px] text-green-400 uppercase font-bold mb-1 flex items-center">
                        {t.title || 'Wildcard'} <InfoTooltip text={t.tooltip || '__filename__'} />
                    </div>
                    <div>
                        <label className="text-[9px] uppercase text-slate-500 block mb-1">{t.file || 'File'}</label>
                        <input
                            className="w-full bg-slate-900/50 p-2 rounded border border-slate-700 text-sm focus:border-green-500 outline-none"
                            placeholder={t.placeholder || 'filename'}
                            value={c.term || ''}
                            onChange={e => onChange({...c, term: e.target.value})}
                        />
                    </div>
                </div>
            );
        };

        const UseVarBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang]?.usevar || {};
            return (
                <div className="flex flex-col gap-2 animate-in fade-in duration-300">
                    <div className="text-[10px] text-amber-400 uppercase font-bold mb-1 flex items-center">
                        {t.title || 'Use Var/Macro'} <InfoTooltip text={t.tooltip || '<var:name> or <macro:name>'} />
                    </div>
                    <div className="flex gap-2">
                        <div className="flex-1">
                            <label className="text-[9px] uppercase text-slate-500 block mb-1">{t.name || 'Name'}</label>
                            <input
                                className="w-full bg-slate-900/50 p-2 rounded border border-slate-700 text-sm focus:border-amber-500 outline-none"
                                placeholder={t.namePlaceholder || 'var_or_macro_name'}
                                value={c.name || ''}
                                onChange={e => onChange({...c, name: e.target.value})}
                            />
                        </div>
                        <div>
                            <label className="text-[9px] uppercase text-slate-500 block mb-1">{t.type || 'Type'}</label>
                            <select
                                className="w-full bg-slate-900/50 p-2 rounded border border-slate-700 text-sm text-amber-200 focus:border-amber-500 outline-none"
                                value={c.varType || 'var'}
                                onChange={e => onChange({...c, varType: e.target.value})}
                            >
                                <option value="var">var</option>
                                <option value="macro">macro</option>
                            </select>
                        </div>
                    </div>
                </div>
            );
        };

        const CFGScheduleBlock = ({ c, onChange, lang }) => {
            const t = TRANSLATIONS[lang]?.cfg_schedule || {};
            const weights = Array.isArray(c.weights) && c.weights.length >= 2 ? c.weights : [7.0, 3.0];
            const updateWeight = (i, v) => {
                const n = [...weights];
                n[i] = Number(v) || 0;
                onChange({...c, weights: n});
            };
            return (
                <div className="flex flex-col gap-2 animate-in fade-in duration-300">
                    <div className="text-[10px] text-sky-400 uppercase font-bold mb-1 flex items-center">
                        {t.title || 'CFG Schedule'} <InfoTooltip text={t.tooltip || '<param[cfg]:7.0->3.0>'} />
                    </div>
                    <div>
                        <label className="text-[9px] uppercase text-slate-500 block mb-1">{t.values || 'CFG values'} <InfoTooltip text={t.hint || 'Interpolate CFG scale over steps. Supports 2+ values.'} /></label>
                        <div className="flex flex-wrap gap-1 items-center">
                            {weights.map((w, idx) => (
                                <div key={idx} className="flex items-center gap-1">
                                    <input type="number" step="0.1" min="0"
                                        className="w-20 bg-slate-900/50 p-1.5 rounded border border-slate-700 text-sm font-mono text-sky-300 focus:border-sky-500 outline-none"
                                        value={w}
                                        onChange={(e) => updateWeight(idx, e.target.value)}
                                    />
                                    {idx < weights.length - 1 && <span className="text-slate-600 text-xs font-bold">→</span>}
                                </div>
                            ))}
                            <button onClick={() => onChange({...c, weights: [...weights, weights[weights.length-1] + 1]})}
                                className="p-1.5 text-slate-500 hover:text-sky-400 border border-dashed border-slate-700 rounded transition-colors"
                            ><Plus size={14}/></button>
                            {weights.length > 2 && (
                                <button onClick={() => onChange({...c, weights: weights.slice(0, -1)})}
                                    className="p-1.5 text-slate-500 hover:text-red-400 border border-dashed border-slate-700 rounded transition-colors"
                                ><X size={14}/></button>
                            )}
                        </div>
                    </div>
                    <div className="text-[11px] font-mono text-sky-300 break-all bg-slate-950/40 border border-slate-800 rounded p-2">
                        {(() => {
                            const validWeights = weights.filter(w => Number.isFinite(w));
                            if (!validWeights.length) return '<param[cfg]:...>';
                            return `<param[cfg]:${validWeights.join('->')}>`;
                        })()}
                    </div>
                </div>
            );
        };

        // === BLOCK TREE (hierarchical block view) ===
        const getBlockChildren = (block) => {
            const c = block?.content || {};
            const kids = [];
            switch (block?.type) {
                case 'pool':
                    if (Array.isArray(c.bodyBlocks)) kids.push(...c.bodyBlocks);
                    break;
                case 'schedule':
                    if (Array.isArray(c.promptBlocks)) c.promptBlocks.forEach(slot => { if (Array.isArray(slot)) kids.push(...slot); });
                    break;
                case 'compound':
                    if (Array.isArray(c.baseBlocks)) kids.push(...c.baseBlocks);
                    if (Array.isArray(c.partBlocks)) c.partBlocks.forEach(slot => { if (Array.isArray(slot)) kids.push(...slot); });
                    break;
                case 'chunk':
                case 'blend':
                    (Array.isArray(c.branches) ? c.branches : []).forEach(br => { if (Array.isArray(br.blocks)) kids.push(...br.blocks); });
                    break;
                case 'morph':
                    (Array.isArray(c.points) ? c.points : []).forEach(pt => { if (Array.isArray(pt.blocks)) kids.push(...pt.blocks); });
                    break;
                case 'bind':
                    if (Array.isArray(c.ownerBlocks)) kids.push(...c.ownerBlocks);
                    if (Array.isArray(c.attrsBlocks)) kids.push(...c.attrsBlocks);
                    break;
                case 'diff':
                    if (Array.isArray(c.baseBlocks)) kids.push(...c.baseBlocks);
                    if (Array.isArray(c.termBlocks)) c.termBlocks.forEach(slot => { if (Array.isArray(slot)) kids.push(...slot); });
                    break;
                case 'sequence':
                    if (Array.isArray(c.innerBlocks)) c.innerBlocks.forEach(slot => { if (Array.isArray(slot)) kids.push(...slot); });
                    if (Array.isArray(c.outerBlocks)) c.outerBlocks.forEach(slot => { if (Array.isArray(slot)) kids.push(...slot); });
                    break;
                case 'group':
                    if (Array.isArray(c.itemBlocks)) c.itemBlocks.forEach(slot => { if (Array.isArray(slot)) kids.push(...slot); });
                    break;
                case 'assemble':
                    if (Array.isArray(c.enc1Blocks)) kids.push(...c.enc1Blocks);
                    if (Array.isArray(c.enc2Blocks)) kids.push(...c.enc2Blocks);
                    if (Array.isArray(c.pooledBlocks)) kids.push(...c.pooledBlocks);
                    break;
                case 'interp':
                    if (Array.isArray(c.bodyBlocks)) kids.push(...c.bodyBlocks);
                    break;
                case 'alternate':
                case 'alternate1':
                case 'alternate2':
                    if (Array.isArray(c.optionBlocks)) c.optionBlocks.forEach(slot => { if (Array.isArray(slot)) kids.push(...slot); });
                    break;
                case 'bind2':
                case 'bind3':
                    if (Array.isArray(c.ownerBlocks)) kids.push(...c.ownerBlocks);
                    if (Array.isArray(c.attrsBlocks)) c.attrsBlocks.forEach(slot => { if (Array.isArray(slot)) kids.push(...slot); });
                    break;
                case 'setvar':
                case 'setmacro':
                case 'usevar':
                case 'cfg_schedule':
                case 'text':
                case 'break':
                case 'toneg':
                case 'param':
                case 'random_wildcard':
                case 'wildcard_double':
                case 'hybrid':
                case 'sequence':
                case 'group':
                    break;
            }
            return kids;
        };

        const BlockTree = ({ blocks, lang, depth = 0 }) => {
            if (!Array.isArray(blocks) || blocks.length === 0) return null;
            const colors = SUB_COLORS;
            return blocks.map((block) => {
                const kids = getBlockChildren(block);
                const hasKids = kids.length > 0;
                const preview = serializeBlock({ type: block.type, content: block.content });
                const icon = (() => {
                    switch (block.type) {
                        case 'text': return 'T';
                        case 'schedule': return 'S';
                        case 'interp': return 'I';
                        case 'pool': return 'P';
                        case 'bind': return 'B';
                        case 'bind2': return 'B2';
                        case 'bind3': return 'B3';
                        case 'diff': return 'D';
                        case 'compound': return 'Cp';
                        case 'assemble': return 'A';
                        case 'chunk': return 'C';
                        case 'blend': return 'Bl';
                        case 'morph': return 'M';
                        case 'cfg_schedule': return 'CF';
                        case 'usevar': return 'V';
                        case 'and': return '&';
                        case 'break': return '//';
                        default: return '?';
                    }
                })();
                const color = colors[block.type] || 'slate';
                const colorHex = { blue: 'text-blue-300', cyan: 'text-cyan-300', amber: 'text-amber-300', violet: 'text-violet-300', emerald: 'text-emerald-300', rose: 'text-rose-300', pink: 'text-pink-300', orange: 'text-orange-300', sky: 'text-sky-300', yellow: 'text-yellow-300', fuchsia: 'text-fuchsia-300' }[color] || 'text-slate-300';
                const bgHex = { blue: 'bg-blue-500/10', cyan: 'bg-cyan-500/10', amber: 'bg-amber-500/10', violet: 'bg-violet-500/10', emerald: 'bg-emerald-500/10', rose: 'bg-rose-500/10', pink: 'bg-pink-500/10', orange: 'bg-orange-500/10', sky: 'bg-sky-500/10', yellow: 'bg-yellow-500/10', fuchsia: 'bg-fuchsia-500/10' }[color] || 'bg-slate-500/10';
                return <BlockTreeNode key={block.id} block={block} kids={kids} hasKids={hasKids} preview={preview} icon={icon} colorHex={colorHex} bgHex={bgHex} lang={lang} depth={depth} />;
            });
        };

        const BlockTreeNode = ({ block, kids, hasKids, preview, icon, colorHex, bgHex, lang, depth }) => {
            const [expanded, setExpanded] = React.useState(depth < 2);
            return (
                <div className="flex flex-col">
                    <div
                        className={`flex items-center gap-1.5 py-0.5 px-1 rounded hover:bg-slate-800/30 cursor-pointer transition-colors ${depth > 0 ? 'border-l-2 border-slate-700/40 ml-2' : ''}`}
                        onClick={() => hasKids && setExpanded(!expanded)}
                    >
                        {hasKids ? (
                            <span className="text-[8px] text-slate-500 w-3 shrink-0">{expanded ? '▼' : '▶'}</span>
                        ) : (
                            <span className="w-3 shrink-0" />
                        )}
                        <span className={`text-[9px] font-bold px-1 rounded ${bgHex} ${colorHex} shrink-0`}>{icon}</span>
                        <span className="text-[10px] font-mono text-slate-300 truncate flex-1 min-w-0" title={preview}>{preview || '(empty)'}</span>
                    </div>
                    {hasKids && expanded && (
                        <BlockTree blocks={kids} lang={lang} depth={depth + 1} />
                    )}
                </div>
            );
        };

        const BlockTreeSection = ({ blocks, lang }) => {
            const [treeOpen, setTreeOpen] = React.useState(false);
            if (!Array.isArray(blocks) || blocks.length === 0) return null;
            return (
                <div className="bg-slate-900/55 border border-slate-700/40 rounded-xl p-4 mb-6">
                    <div className="flex items-center justify-between mb-2">
                        <h3 className="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center">
                            {lang === 'ru' ? 'Дерево блоков' : 'Block Tree'} <InfoTooltip text={lang === 'ru' ? 'Иерархическая структура всех блоков.' : 'Hierarchical block structure.'} />
                        </h3>
                        <button onClick={() => setTreeOpen(!treeOpen)}
                            className="text-[10px] font-bold px-2 py-1 rounded border border-slate-700 text-slate-400 hover:text-white transition-colors"
                        >
                            {treeOpen ? (lang === 'ru' ? 'Свернуть' : 'Collapse') : (lang === 'ru' ? 'Развернуть' : 'Expand')}
                        </button>
                    </div>
                    {treeOpen && (
                        <div className="bg-slate-950/40 border border-slate-800 rounded-lg p-3 max-h-96 overflow-auto">
                            <BlockTree blocks={blocks} lang={lang} />
                        </div>
                    )}
                </div>
            );
        };

        const CURVE_COLORS = ['#60a5fa','#f472b6','#34d399','#fbbf24','#a78bfa','#fb923c','#22d3ee','#f87171','#a3e635','#e879f9','#38bdf8','#c084fc','#fde68a','#6ee7b7'];

        const CURVE_FORMULAS = {
            linear: 'f(t) = t',
            ease: '3t² − 2t³ (smoothstep)',
            'ease-in': 't²',
            'ease-out': '2t − t²',
            'ease-in-out': '3t² − 2t³ (smoothstep)',
            bezier: '3t² − 2t³ (cubic-bezier(0,0,1,1))',
            catmull: '6t⁵ − 15t⁴ + 10t³ (smootherstep)',
            'sine-in': '1 − cos(t·π/2)',
            'sine-out': 'sin(t·π/2)',
            'sine-in-out': '−(cos(π·t) − 1)/2',
            'quart-in': 't⁴',
            'quart-out': '1 − (1−t)⁴',
            'quart-in-out': '8t⁴ (t<0.5) | 1 − (−2t+2)⁴/2',
            'quint-in': 't⁵',
            'quint-out': '1 − (1−t)⁵',
            'quint-in-out': '16t⁵ (t<0.5) | 1 − (−2t+2)⁵/2',
            'expo-in': '2^(10·(t−1))',
            'expo-out': '1 − 2^(−10·t)',
            'expo-in-out': '2^(10·(2t−1))/2 (t<0.5) | (2−2^(−10·(2t−1)))/2',
            'circ-in': '1 − √(1−t²)',
            'circ-out': '√(1−(t−1)²)',
            'circ-in-out': '(1−√(1−4t²))/2 (t<0.5) | (√(1−(2t−2)²)+1)/2',
            'back-in': 't³ − t·sin(t·π)',
            'back-out': '(t−1)³ + (t−1)·sin((t−1)·π) + 1',
            'back-in-out': '(8t³−4t·sin(2t·π))/2 (t<0.5) | (8(1−t)³−4(1−t)·sin(2(1−t)·π))/2·sign',
            bounce: 'Penner ease-out-bounce — 7.5625·t² с дроблением на 4 фазы',
            slerp: 'sin²(t·π/2)'
        };

        const CurvePreviewModal = ({ open, onClose, curves, selected, onSelect }) => {
            if (!open) return null;
            const [mouseT, setMouseT] = React.useState(null);
            const [compareMode, setCompareMode] = React.useState(false);
            const [compareKeys, setCompareKeys] = React.useState([]);
            const [stepTotal, setStepTotal] = React.useState('');
            const [stepFrom, setStepFrom] = React.useState('');
            const [stepTo, setStepTo] = React.useState('');
            const ru = window._lang === 'ru';
            const W = 600, H = 420;
            const ML = 50, MR = 20, MT = 20, MB = 40;
            const pW = W - ML - MR, pH = H - MT - MB;
            const useSteps = stepTotal && parseInt(stepTotal) > 0;
            const totalS = useSteps ? parseInt(stepTotal) : 1;
            const fromS = stepFrom ? parseInt(stepFrom) : 1;
            const toS = stepTo ? parseInt(stepTo) : totalS;
            const stepSpan = toS - fromS;
            const sx = (t) => ML + t * pW;
            const sy = (y) => MT + (1 - (y + 0.15) / 1.3) * pH;
            const keys = Object.keys(curves);
            const handleSvgMouseMove = (e) => {
                const rect = e.target.closest('svg').getBoundingClientRect();
                const xPct = (e.clientX - rect.left) / rect.width;
                const t = Math.max(0, Math.min(1, xPct));
                setMouseT(t);
            };
            const handleSvgMouseLeave = () => setMouseT(null);
            const toggleCompareKey = (key) => {
                if (compareKeys.includes(key)) {
                    setCompareKeys(compareKeys.filter(k => k !== key));
                } else {
                    setCompareKeys([...compareKeys, key]);
                }
            };
            const effectiveKeys = compareMode ? compareKeys : (selected ? [selected] : []);
            const mouseStep = useSteps && mouseT !== null ? Math.round(fromS + mouseT * stepSpan) : null;
            const NUM_PTS = useSteps ? Math.min(totalS, 20) : 9;
            const valuePoints = useSteps
                ? Array.from({length: NUM_PTS}, (_, i) => {
                    const step = Math.round(fromS + (i / (NUM_PTS - 1)) * stepSpan);
                    return {label: 'step ' + step, t: stepSpan > 0 ? (step - fromS) / stepSpan : 0.5};
                  })
                : [0, 0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875, 1.0].map(v => ({label: v.toFixed(3), t: v}));
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70" onClick={onClose}>
                    <div className="bg-slate-900 border border-slate-600 rounded-2xl p-5 max-w-2xl w-full mx-4 max-h-[90vh] overflow-auto" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-lg font-bold text-slate-200">{ru ? 'Предпросмотр кривых' : 'Curve Preview'}</h2>
                            <div className="flex items-center gap-2">
                                <button onClick={() => { setCompareMode(!compareMode); if (!compareMode) setCompareKeys(selected ? [selected] : []); }}
                                    className={'text-[10px] font-bold px-2 py-1 rounded border transition-colors ' + (compareMode ? 'bg-yellow-500/20 border-yellow-500/40 text-yellow-300' : 'border-slate-700 text-slate-400 hover:border-slate-500')}>
                                    {compareMode ? (ru ? 'Сравнение' : 'Compare') : (ru ? 'Одиночный' : 'Single')}
                                </button>
                                <button onClick={onClose} className="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
                            </div>
                        </div>
                        {selected && !compareMode && <div className="text-xs text-slate-400 mb-1">{ru ? 'Выбрано' : 'Selected'}: <span className="text-white font-mono">{curves[selected]}</span></div>}
                        {compareMode && <div className="text-xs text-slate-400 mb-1">{ru ? 'Кликните на кривые для сравнения' : 'Click curves to compare'}</div>}
                        <svg viewBox={'0 0 ' + W + ' ' + H} className="w-full cursor-crosshair" onMouseMove={handleSvgMouseMove} onMouseLeave={handleSvgMouseLeave}>
                            {(useSteps
                                ? [0, 0.25, 0.5, 0.75, 1]
                                : [0, 0.25, 0.5, 0.75, 1]
                            ).map(v => (<g key={'g'+v}>
                                <line x1={sx(v)} y1={MT} x2={sx(v)} y2={MT+pH} stroke="#1e293b" strokeWidth="1"/>
                                <text x={sx(v)} y={MT+pH+14} textAnchor="middle" fill="#64748b" fontSize="10">{useSteps ? Math.round(fromS + v * stepSpan) : v}</text>
                                <line x1={ML} y1={sy(v)} x2={ML+pW} y2={sy(v)} stroke="#1e293b" strokeWidth="1"/>
                                <text x={ML-6} y={sy(v)+3} textAnchor="end" fill="#64748b" fontSize="10">{v.toFixed(2)}</text>
                            </g>))}
                            <line x1={ML} y1={sy(1)} x2={ML+pW} y2={sy(1)} stroke="#334155" strokeWidth="1" strokeDasharray="4 4"/>
                            <line x1={ML} y1={sy(0)} x2={ML+pW} y2={sy(0)} stroke="#334155" strokeWidth="1" strokeDasharray="4 4"/>
                            {/* linear reference */}
                            {(() => {
                                const pts = []; for (let t=0;t<=1;t+=0.005) pts.push(sx(t)+','+sy(t));
                                return <path d={'M'+pts.join(' L')} fill="none" stroke="#475569" strokeWidth="1" opacity="0.4"/>;
                            })()}
                            {/* curve paths */}
                            {effectiveKeys.map((key, idx) => {
                                const pts = []; for (let t=0;t<=1;t+=0.005) pts.push(sx(t)+','+sy(applyEase(t,key)));
                                const color = CURVE_COLORS[idx % CURVE_COLORS.length];
                                return <path key={key} d={'M'+pts.join(' L')} fill="none" stroke={color} strokeWidth="2.5" opacity={0.85}/>;
                            })}
                            {/* mouse cursor */}
                            {mouseT !== null && (() => {
                                const mx = sx(mouseT);
                                let minVal = 0, maxVal = 1;
                                const easedVals = effectiveKeys.map(k => applyEase(mouseT, k));
                                return <>
                                    <line x1={mx} y1={MT} x2={mx} y2={MT+pH} stroke="#fbbf24" strokeWidth="1" strokeDasharray="3 3"/>
                                    {easedVals.map((v, i) => (
                                        <circle key={i} cx={mx} cy={sy(v)} r="4" fill={CURVE_COLORS[i % CURVE_COLORS.length]} stroke="#1e293b" strokeWidth="1.5"/>
                                    ))}
                                </>;
                            })()}
                            {/* overshoot lines */}
                            <line x1={ML} y1={sy(0)} x2={ML+pW} y2={sy(0)} stroke="#dc2626" strokeWidth="0.5" opacity="0.3"/>
                            <line x1={ML} y1={sy(1)} x2={ML+pW} y2={sy(1)} stroke="#dc2626" strokeWidth="0.5" opacity="0.3"/>
                            <text x={ML+pW+4} y={sy(0)+3} fill="#dc2626" fontSize="8" opacity="0.5">0</text>

                        {/* formula */}
                        {!compareMode && selected && CURVE_FORMULAS[selected] && (

                        {/* step range inputs */}
                        <details className="mt-2 group">
                            <summary className="text-[10px] text-slate-500 cursor-pointer hover:text-slate-300 transition-colors select-none">

                                        className="w-full bg-slate-950/40 p-1.5 rounded border border-slate-700 text-xs font-mono text-slate-300 focus:border-fuchsia-500 outline-none"

                                </div>
                                <div className="flex-1">
                                    <label className="text-[9px] uppercase text-slate-600 font-bold block mb-0.5">{ru ? 'От шага' : 'From step'}</label>

                                        className="w-full bg-slate-950/40 p-1.5 rounded border border-slate-700 text-xs font-mono text-slate-300 focus:border-fuchsia-500 outline-none"
                                        placeholder="e.g. 5 (default 1)" />
                                </div>
                                <div className="flex-1">
                                    <label className="text-[9px] uppercase text-slate-600 font-bold block mb-0.5">{ru ? 'До шага' : 'To step'}</label>
                                    <input type="text" value={stepTo} onChange={e => setStepTo(e.target.value)}
                                        className="w-full bg-slate-950/40 p-1.5 rounded border border-slate-700 text-xs font-mono text-slate-300 focus:border-fuchsia-500 outline-none"
                                        placeholder={ru ? 'по умолч. = всего' : 'default = total'} />
                                </div>
                            </div>
                        </details>
                        {/* curve list */}
                        <div className="mt-3 max-h-36 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-0.5">
                            {keys.map((key,i) => (
                                <div key={key}
                                    className={'flex items-center gap-1.5 px-2 py-0.5 rounded cursor-pointer text-xs transition-colors ' + (
                                        compareMode
                                            ? (compareKeys.includes(key) ? 'bg-slate-700/60 text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50')
                                            : (key===selected ? 'bg-slate-700/60 text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50')
                                    )}
                                    onClick={() => compareMode ? toggleCompareKey(key) : (onSelect && onSelect(key))}
                                >

                                        style={{backgroundColor: compareMode && compareKeys.includes(key) ? CURVE_COLORS[compareKeys.indexOf(key) % CURVE_COLORS.length] : (key===selected?'#60a5fa':CURVE_COLORS[i%CURVE_COLORS.length])}}>
                                    </span>
                                    {curves[key]}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---

        const App = () => {
            const [lang, setLang] = useState('en');
            const [blocks, setBlocks] = useState(() => {
                try {
                    const saved = localStorage.getItem('pp21_builder_blocks');

            });
            const [preview, setPreview] = useState('');
            const [examplesOpen, setExamplesOpen] = useState(false);
            const [isValid, setIsValid] = useState(true);
            const [lintMessages, setLintMessages] = useState([]);
            const [showCurvePreview, setShowCurvePreview] = useState(false);
            const [previewCurve, setPreviewCurve] = useState('ease-in-out');
            const [copied, setCopied] = useState(false);
            const [timelineSteps, setTimelineSteps] = useState(20);
            const [showSettings, setShowSettings] = useState(false);
            const [settingsSections, setSettingsSections] = useState({ weight: true, sched: true, backend: true, perf: true });
            const [settings, setSettings] = useState(() => {
                try {
                    const saved = localStorage.getItem('pp21_builder_settings');
                    return saved ? JSON.parse(saved) : {
                        weightInterpretation: 'a1111',
                        bind2UsePath2: false,
                        bind2NormalizeWeights: false,
                        bind3CumulativeContext: false,
                        applyAdvancedWeights: false,
                        allowEmptyAlternate: true,
                        dedupScheduleSteps: false,
                        suppressStandaloneColon: true,
                        expandAlternatePerStep: true,
                        attentionDeltaAdditive: false,
                        groupComboLimit: 100,
                        groupComboFallback: 'truncate',
                        cacheSize: 4096,
                        recursionLimit: 0,
                        seed: 42,
                        useScheduling: true,
                    };
                } catch(e) {
                    return {
                        weightInterpretation: 'a1111',
                        bind2UsePath2: false,
                        bind2NormalizeWeights: false,
                        bind3CumulativeContext: false,
                        applyAdvancedWeights: false,
                        allowEmptyAlternate: true,
                        dedupScheduleSteps: false,
                        suppressStandaloneColon: true,
                        expandAlternatePerStep: true,
                        attentionDeltaAdditive: false,
                        groupComboLimit: 100,
                        groupComboFallback: 'truncate',
                        cacheSize: 4096,
                        recursionLimit: 0,
                        seed: 42,
                        useScheduling: true,
                    };
                }
            });
            const updateSetting = (key, value) => {
                const next = { ...settings, [key]: value };
                setSettings(next);
                try { localStorage.setItem('pp21_builder_settings', JSON.stringify(next)); } catch(e) {}
            };

            // Shorthand for current language translations
            const t = TRANSLATIONS[lang];
            window._lang = lang;

            const timelineSegments = useMemo(() => buildPromptTimeline(blocks, timelineSteps, settings.seed, settings.useScheduling), [blocks, timelineSteps, settings.seed, settings.useScheduling]);
            const scheduleTracks = useMemo(() => {
                return blocks
                    .map((b, idx) => {
                        if (!['schedule', 'interp', 'morph'].includes(b.type)) return null;
                        const rows = b.type === 'schedule'
                            ? scheduleRowsFromTimeline(buildScheduleTimeline(b.content || {}, timelineSteps), timelineSteps)
                            : buildBlockTimelineRows(b, timelineSteps, settings.useScheduling);
                        return {
                            id: b.id,
                            index: idx + 1,
                            mode: (b.content?.mode || b.content?.easing || b.content?.curve || 'dynamic'),
                            label: b.type,
                            rows
                        };
                    })
                    .filter(Boolean);
            }, [blocks, timelineSteps, settings.useScheduling]);

            useEffect(() => {
                localStorage.setItem('pp21_builder_blocks', JSON.stringify(blocks));
            }, [blocks]);

            useEffect(() => {
                const parts = blocks.map((b) => serializeBlock(b)).filter((x) => x !== '');
                const res = joinPromptParts(parts);
                 
                const openRound = (res.match(/\(/g) || []).length;
                const closeRound = (res.match(/\)/g) || []).length;
                const openSquare = (res.match(/\[/g) || []).length;
                const closeSquare = (res.match(/\]/g) || []).length;

                const lint = [];
                if (!res.trim()) lint.push({ level: 'err', text: lang === 'ru' ? 'Пустой prompt.' : 'Prompt is empty.' });
                if (openRound !== closeRound) lint.push({ level: 'err', text: lang === 'ru' ? 'Несбалансированные круглые скобки.' : 'Unbalanced round brackets.' });
                if (openSquare !== closeSquare) lint.push({ level: 'err', text: lang === 'ru' ? 'Несбалансированные квадратные скобки.' : 'Unbalanced square brackets.' });
                if (/^\s*AND\b/.test(res) || /\bAND\s*$/.test(res)) lint.push({ level: 'err', text: lang === 'ru' ? 'AND стоит на краю строки.' : 'AND appears at prompt edge.' });
                if (/\bAND\s+AND\b/.test(res)) lint.push({ level: 'err', text: lang === 'ru' ? 'Два AND подряд.' : 'Repeated AND connector.' });
                if (/\bBREAK\s+BREAK\b/.test(res)) lint.push({ level: 'warn', text: lang === 'ru' ? 'Два BREAK подряд.' : 'Repeated BREAK separator.' });

                blocks.forEach((b, idx) => {
                    const c = b.content || {};
                    if (b.type !== 'bind') {
                        const nbind = nestedBindCount(c);
                        if (nbind > 0) {
                            lint.push({ level: 'warn', text: (lang === 'ru'
                                ? `Блок #${idx + 1}: BIND-блок вложен в другой backend-блок и будет автоматически транспилирован в COMPOUND (как в бэкенде).`
                                : `Block #${idx + 1}: nested BIND inside a backend block is auto-transpiled to COMPOUND (as the backend does).`) });
                        }
                    }
                    if (b.type === 'sequence' && !String(c.owner || '').trim()) {
                        lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': sequence без owner.' : ': sequence has no owner.') });
                    }
                    if (b.type === 'schedule') {
                        const mode = c.mode || 'postfix';
                        const limit = String(c.limit || '').trim();
                        const promptBlocks = Array.isArray(c.promptBlocks) ? c.promptBlocks : [];
                        const prompts = Array.isArray(c.prompts) ? c.prompts : [];
                        const nonEmptyPrompts = prompts.filter((x) => String(x || '').trim() !== '');
                        const nonEmptyBlockSlots = promptBlocks.filter(slot => Array.isArray(slot) && slot.length > 0);
                        const totalSlots = Math.max(nonEmptyPrompts.length, nonEmptyBlockSlots.length);

                        if (totalSlots < 2) {
                            lint.push({ level: 'warn', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': для schedule обычно нужно минимум 2 состояния.' : ': schedule usually needs at least 2 states.') });
                        }
                        if ((mode === 'inner' || mode === 'postfix') && !limit) {
                            lint.push({ level: 'warn', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': не задан N (boundary/end step).' : ': missing N (boundary/end step).') });
                        }
                        if (limit && parseBoundarySpec(limit, timelineSteps) === null) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Неверная boundary в блоке #' : 'Invalid boundary in block #') + (idx + 1) + `: ${limit}` });
                        }
                        const ranges = String(c.ranges || '').trim();
                        if (ranges) {
                            if (!limit) {
                                lint.push({ level: 'err', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': интервалы заданы без N.' : ': ranges are set without N.') });
                            }
                            ranges.split(',').map(x => x.trim()).filter(Boolean).forEach((r) => {
                                const m = r.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+)%?)\s*-\s*([+-]?(?:\d+(?:\.\d+)?|\.\d+)%?)$/);
                                if (!m) {
                                    lint.push({ level: 'err', text: (lang === 'ru' ? 'Неверный range: ' : 'Invalid range: ') + r });
                                    return;
                                }
                                const a = m[1], b2 = m[2];
                                const aPct = a.endsWith('%');
                                const bPct = b2.endsWith('%');
                                if (aPct !== bPct) {
                                    lint.push({ level: 'err', text: (lang === 'ru' ? 'Смешанный percent-range: ' : 'Mixed percent-range: ') + r });
                                    return;
                                }
                                const av = parseFloat(a.replace('%', ''));
                                const bv = parseFloat(b2.replace('%', ''));
                                if (av > bv) {
                                    lint.push({ level: 'err', text: (lang === 'ru' ? 'reverse_range: ' : 'reverse_range: ') + r });
                                }
                            });
                        }
                    }
                    if (b.type === 'alternate') {
                        const hasEmpty = (c.options || []).some((x) => String(x).trim() === '');
                        if (hasEmpty) lint.push({ level: 'warn', text: (lang === 'ru' ? 'Пустые alternate-варианты в блоке #' : 'Empty alternate options in block #') + (idx + 1) });
                    }
                    if (b.type === 'alternate1') {
                        const options = Array.isArray(c.options) ? c.options : [];
                        if (options.length < 2) {
                            lint.push({ level: 'warn', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': alternate1 обычно требует минимум 2 варианта.' : ': alternate1 usually needs at least 2 options.') });
                        }
                        const hasEmpty = options.some((x) => String(x || '').trim() === '');
                        if (hasEmpty) {
                            lint.push({ level: 'warn', text: (lang === 'ru' ? 'Пустые alternate1-варианты в блоке #' : 'Empty alternate1 options in block #') + (idx + 1) });
                        }
                    }
                    if (b.type === 'alternate2') {
                        const tokens = (Array.isArray(c.options) ? c.options : []).map((x) => String(x || '').trim());
                        const nonEmpty = tokens.filter(Boolean);
                        if (nonEmpty.length < 2) {
                            lint.push({ level: 'warn', text: (lang === 'ru' ? 'Блок #' : 'Block #') + (idx + 1) + (lang === 'ru' ? ': alternate2 обычно требует минимум 2 plain-токена.' : ': alternate2 usually needs at least 2 plain tokens.') });
                        }
                        const invalid = nonEmpty.find((x) => /[\[\]\{\}\(\),&:!]/.test(x));
                        if (invalid) {
                            lint.push({ level: 'err', text: (lang === 'ru' ? 'Недопустимый символ в alternate2: ' : 'Invalid symbol in alternate2: ') + invalid });
                        }
                    }
                    if (b.type === 'interp') {
                        const body = String(c.body || '').trim();
